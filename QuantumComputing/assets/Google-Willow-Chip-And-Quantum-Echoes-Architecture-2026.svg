<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Google Willow Quantum Chip and Quantum Echoes Architecture</title>
  <desc id="desc">Willow 105-qubit superconducting transmon processor, below-threshold surface code scaling, and Out-of-Time-Order Correlator quantum echoes protocol</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="820" rx="16" fill="url(#bg-grad)"/>

  <!-- Header Banner -->
  <rect x="30" y="24" width="1180" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Google Willow Chip &amp; Quantum Echoes Architecture</text>
  <text x="60" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">105-Qubit Below-Threshold Surface Code Scaling, Loschmidt OTOC Reversal, and Verifiable Advantage</text>
  <rect x="1050" y="44" width="130" height="30" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="1115" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">WILLOW (2026)</text>

  <!-- Panel 1: Physical Willow Silicon & Surface Code (Top Left) -->
  <rect x="30" y="115" width="575" height="315" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="50" y="130" width="310" height="26" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="60" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">1. WILLOW SILICON &amp; SURFACE CODE</text>

  <!-- Sub-block: Physical Hardware -->
  <rect x="50" y="168" width="255" height="245" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Physical Transmon Grid</text>
  <text x="65" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">105 Superconducting Qubits</text>
  <text x="65" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• 2D planar square grid topology</text>
  <text x="65" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Cryogenic base: 10–15 mK dilution</text>
  <text x="65" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Tunable transmon couplers</text>
  <text x="65" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• 2-qubit gate error: &lt; 0.15%</text>
  <text x="65" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Readout error: &lt; 0.6%</text>
  <text x="65" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">Sub-Threshold Achievement:</text>
  <text x="65" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Adding qubits reduces error rate</text>
  <text x="65" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Breakthrough: Λ = ε_L(d) / ε_L(d-2) &lt; 1</text>
  <text x="65" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#4ade80">d=7 (105 Qubits) beats d=5 (49 Qubits)</text>

  <!-- Sub-block: Surface Code Lattice -->
  <rect x="320" y="168" width="265" height="245" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="335" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Surface Code Scaling (d=7)</text>
  <text x="335" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Fault-Tolerant Threshold Crossed</text>
  <text x="335" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Data Qubits: Store quantum info</text>
  <text x="335" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Measure Qubits: Detect syndromes</text>
  <text x="335" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• X-type stabilizers: Bit-flip checks</text>
  <text x="335" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Z-type stabilizers: Phase-flip checks</text>
  <text x="335" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Exponential Suppression:</text>
  <text x="335" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Logical error rate scales as:</text>
  <text x="350" y="355" font-family="Courier, monospace" font-size="11" fill="#fbbf24">ε_L ∝ (p / p_th)^((d+1)/2)</text>
  <text x="335" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#4ade80">Physical error p &lt; threshold p_th</text>
  <text x="335" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">First hardware to reach this regime</text>

  <!-- Panel 2: Quantum Echoes (OTOC) Algorithm (Top Right) -->
  <rect x="635" y="115" width="575" height="315" rx="12" fill="url(#card-grad)" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="655" y="130" width="310" height="26" rx="6" fill="#4ade80" fill-opacity="0.2"/>
  <text x="665" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4ade80">2. QUANTUM ECHOES (OTOC) PROTOCOL</text>

  <!-- 4 Step Flow: Init -> Forward U -> Perturb W -> Backward U_dagger -->
  <rect x="655" y="168" width="125" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1. State Prep</text>
  <text x="717" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Initialize |ψ_0⟩</text>
  <text x="717" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Ground state of</text>
  <text x="717" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">105 coupled qubits</text>

  <rect x="795" y="168" width="125" height="90" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="857" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">2. Forward Run</text>
  <text x="857" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Apply Unitary U(t)</text>
  <text x="857" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Information spreads</text>
  <text x="857" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">across 105 qubits</text>

  <rect x="935" y="168" width="125" height="90" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
  <text x="997" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">3. Perturbation</text>
  <text x="997" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Inject Disturbance W</text>
  <text x="997" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">"Pebble in the pond"</text>
  <text x="997" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Single-qubit rotation</text>

  <rect x="1075" y="168" width="120" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="1135" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">4. Time Reverse</text>
  <text x="1135" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Apply U^(†)(t)</text>
  <text x="1135" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Invert microwave drive</text>
  <text x="1135" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Measure Loschmidt Echo</text>

  <!-- Connectors -->
  <path d="M 780 213 L 795 213" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 920 213 L 935 213" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 1060 213 L 1075 213" fill="none" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- OTOC Explanation Box -->
  <rect x="655" y="275" width="540" height="138" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="675" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Out-of-Time-Order Correlator (OTOC) Mechanics</text>
  <text x="675" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Measures quantum information scrambling across space and time:</text>
  <text x="690" y="342" font-family="Courier, monospace" font-size="11" fill="#38bdf8">C(t) = ⟨ W^(†)(0) V^(†)(t) W(0) V(t) ⟩</text>
  <text x="675" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Scrambling velocity reveals quantum butterfly effect and thermalization rate.</text>
  <text x="675" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4ade80">• 13,000x Speedup: Frontier Supercomputer = ~10,000 years vs Willow = ~2 hours.</text>
  <text x="675" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Algorithm is hardware-agnostic: portable to any gate-based quantum processor.</text>

  <!-- Panel 3: Verifiable Quantum Advantage (Bottom Left) -->
  <rect x="30" y="450" width="575" height="305" rx="12" fill="url(#card-grad)" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="50" y="465" width="310" height="26" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
  <text x="60" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">3. VERIFIABLE ADVANTAGE BENCHMARK</text>

  <rect x="50" y="505" width="255" height="225" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="65" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">2019 Sycamore Random Sampling</text>
  <text x="65" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• 53 physical qubits (noisy)</text>
  <text x="65" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Random Circuit Sampling (RCS)</text>
  <text x="65" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Contested classical baselines:</text>
  <text x="65" y="604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  tensor network simulation cut</text>
  <text x="65" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  claim from 10,000 yrs to days.</text>
  <text x="65" y="646" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f43f5e">• Unverifiable at scale:</text>
  <text x="65" y="664" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  Classical check required brute</text>
  <text x="65" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  force calculation.</text>
  <text x="65" y="710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">No practical physical problem solved</text>

  <rect x="320" y="505" width="265" height="225" rx="8" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1"/>
  <text x="335" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">2024–2026 Willow Quantum Echoes</text>
  <text x="335" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• 105 physical qubits (low noise)</text>
  <text x="335" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Real physics: OTOC scrambling</text>
  <text x="335" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Robust to tensor contraction:</text>
  <text x="335" y="604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  backward time inversion creates</text>
  <text x="335" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  extreme entanglement entropy.</text>
  <text x="335" y="646" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">• Fully Verifiable:</text>
  <text x="335" y="664" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  Checkable via small subsystems</text>
  <text x="335" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">  and cross-entropy calibration.</text>
  <text x="335" y="710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#4ade80">First Testable Quantum Supremacy</text>

  <!-- Panel 4: Quantum-Classical Hybrid Architecture (Bottom Right) -->
  <rect x="635" y="450" width="575" height="305" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="655" y="465" width="310" height="26" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="665" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">4. HYBRID CO-PROCESSOR ARCHITECTURE</text>

  <!-- Layer 1: Classical Host -->
  <rect x="655" y="505" width="535" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="675" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Classical Host Environment (Linux / Python / Cirq)</text>
  <text x="675" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Program compilation, parameter optimization loop, and result statistical aggregation.</text>

  <!-- Arrow down -->
  <path d="M 922 563 L 922 580" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Layer 2: Microwave Control Rack -->
  <rect x="655" y="583" width="535" height="58" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
  <text x="675" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Cryogenic Controller Rack (Room Temp to 4K Stage)</text>
  <text x="675" y="625" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">High-speed FPGA pulse synthesizers, microwave DACs/ADCs, real-time syndrome decoders.</text>

  <!-- Arrow down -->
  <path d="M 922 641 L 922 658" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Layer 3: Willow QPU Core -->
  <rect x="655" y="661" width="535" height="68" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Willow QPU Core (10–15 mK Mixing Chamber)</text>
  <text x="675" y="701" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">105 superconducting transmon qubits execute forward/backward echo pulses with &lt; 0.15% error.</text>
  <text x="675" y="718" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Co-processor model: developers invoke quantum kernels as asynchronous cloud accelerators.</text>

  <!-- Centered Footer Attribution -->
  <text x="620" y="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Architecture &amp; Design by Srinivasan Ragothaman (@rsrini7)</text>
</svg>