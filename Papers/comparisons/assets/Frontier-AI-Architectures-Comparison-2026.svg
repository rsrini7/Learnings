<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="780" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="400" y1="90" x2="400" y2="760" />
    <line x1="800" y1="90" x2="800" y2="760" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="1120" height="54" rx="8" fill="#1e293b" opacity="0.6" stroke="#334155" />
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      Frontier AI Architectural Taxonomy: Prediction Space, Complexity &amp; Latency
    </text>
    <rect x="910" y="14" width="190" height="26" rx="13" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="1005" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">
      2026 Production Reality
    </text>
  </g>

  <!-- Row 1, Col 1: Transformers / VLMs -->
  <g transform="translate(40, 102)" filter="url(#shadow)">
    <rect width="350" height="302" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="38" rx="10" fill="#1e293b" />
    <rect x="0" y="28" width="350" height="10" fill="#1e293b" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      Transformers &amp; Autoregressive VLMs
    </text>

    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Target:</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Discrete Next Tokens (P(w_t | w_&lt;t))</text>

    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Complexity:</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">O(n²) Self-Attention Matrix</text>

    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Primary Role:</text>
    <text x="105" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Symbolic Reasoning &amp; Chat</text>

    <rect x="16" y="130" width="318" height="154" rx="6" fill="#1e293b" opacity="0.7" stroke="#334155" />
    <text x="26" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Trade-offs &amp; Edge Reality:</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Token memorization inflates parameter counts</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Decoding bounded by GPU memory bandwidth</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Multi-token sentences introduce ~200ms lag</text>
    <text x="26" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Sub-optimal for closed-loop edge robotics</text>
    <text x="26" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Status: Foundation for Cognitive Reasoning</text>
  </g>

  <!-- Row 1, Col 2: VL-JEPA -->
  <g transform="translate(425, 102)" filter="url(#shadow)">
    <rect width="350" height="302" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="38" rx="10" fill="#1e293b" />
    <rect x="0" y="28" width="350" height="10" fill="#1e293b" />
    <circle cx="20" cy="19" r="6" fill="#4ade80" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      VL-JEPA (Joint Embedding Architecture)
    </text>

    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">Target:</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Continuous Semantic Embeddings (s_y)</text>

    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">Complexity:</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Single-Pass Non-Generative Predictor</text>

    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">Primary Role:</text>
    <text x="105" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Real-Time Streaming Video &amp; Robotics</text>

    <rect x="16" y="130" width="318" height="154" rx="6" fill="#1e293b" opacity="0.7" stroke="#334155" />
    <text x="26" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Trade-offs &amp; Edge Reality:</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• 1.6B params beats GPT-4o on TempCompass</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• 2.85x fewer FLOPs via selective frame update</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Latent Model Predictive Control (16s vs 4min)</text>
    <text x="26" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Does not generate conversational text or pixels</text>
    <text x="26" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#4ade80">Status: Edge Vision &amp; Robot Perception Standard</text>
  </g>

  <!-- Row 1, Col 3: Mamba-3 -->
  <g transform="translate(810, 102)" filter="url(#shadow)">
    <rect width="350" height="302" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="38" rx="10" fill="#1e293b" />
    <rect x="0" y="28" width="350" height="10" fill="#1e293b" />
    <circle cx="20" cy="19" r="6" fill="#c084fc" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      Mamba-3 (State-Space Sequence Models)
    </text>

    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Target:</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Sequential Compressed Latent States</text>

    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Complexity:</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Linear O(n) Time / Constant O(1) Memory</text>

    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Primary Role:</text>
    <text x="105" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Ultra Long-Context &amp; Edge Hardware</text>

    <rect x="16" y="130" width="318" height="154" rx="6" fill="#1e293b" opacity="0.7" stroke="#334155" />
    <text x="26" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Trade-offs &amp; Edge Reality:</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• 5x faster throughput on 100k+ token sequences</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Saturates GPU tensor core arithmetic intensity</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Resolves state tracking &amp; counter parity tasks</text>
    <text x="26" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Slightly lower in-context few-shot adaptation</text>
    <text x="26" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#c084fc">Status: High-Throughput Backbone Engine</text>
  </g>

  <!-- Row 2, Col 1: Diffusion Models -->
  <g transform="translate(40, 432)" filter="url(#shadow)">
    <rect width="350" height="302" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="38" rx="10" fill="#1e293b" />
    <rect x="0" y="28" width="350" height="10" fill="#1e293b" />
    <circle cx="20" cy="19" r="6" fill="#f43f5e" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      Diffusion &amp; Flow Matching Models
    </text>

    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">Target:</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Iterative Denoised Pixels &amp; Actions</text>

    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">Complexity:</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Iterative SDE/ODE (20–50 steps)</text>

    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">Primary Role:</text>
    <text x="105" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Photorealistic Image/Video Synthesis</text>

    <rect x="16" y="130" width="318" height="154" rx="6" fill="#1e293b" opacity="0.7" stroke="#334155" />
    <text x="26" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Trade-offs &amp; Edge Reality:</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• State-of-the-art visual generation fidelity</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Models multimodal action distributions (pi_0)</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Multi-step rollout too slow for perception</text>
    <text x="26" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Severe power drain in battery-powered devices</text>
    <text x="26" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f43f5e">Status: Action Chunking &amp; Media Generation</text>
  </g>

  <!-- Row 2, Col 2: Dual-System VLA -->
  <g transform="translate(425, 432)" filter="url(#shadow)">
    <rect width="350" height="302" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="38" rx="10" fill="#1e293b" />
    <rect x="0" y="28" width="350" height="10" fill="#1e293b" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      Dual-System VLA (Vision-Language-Action)
    </text>

    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Target:</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Joint Sub-Goals + Motor Control Chunks</text>

    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Complexity:</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Hierarchical Dual-Frequency Decoupling</text>

    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Primary Role:</text>
    <text x="105" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Robotic Manipulation &amp; Failure Recovery</text>

    <rect x="16" y="130" width="318" height="154" rx="6" fill="#1e293b" opacity="0.7" stroke="#334155" />
    <text x="26" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Trade-offs &amp; Edge Reality:</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• System 2 (VLM, 1 Hz) plans high-level goals</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• System 1 (Action expert, 50 Hz) executes</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• 60–90% real-world success on complex tasks</text>
    <text x="26" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Deployed in pi_0, Figure Helix, Nvidia GR00T</text>
    <text x="26" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#fbbf24">Status: Production Robotics Standard 2026</text>
  </g>

  <!-- Row 2, Col 3: Nvidia Cosmos -->
  <g transform="translate(810, 432)" filter="url(#shadow)">
    <rect width="350" height="302" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="38" rx="10" fill="#1e293b" />
    <rect x="0" y="28" width="350" height="10" fill="#1e293b" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      Nvidia Cosmos (World Foundation Models)
    </text>

    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">Target:</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Physics-Consistent Synthetic Video</text>

    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">Complexity:</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Diffusion + Autoregressive Token Scaling</text>

    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">Primary Role:</text>
    <text x="105" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Physical AI Simulation &amp; Pre-training</text>

    <rect x="16" y="130" width="318" height="154" rx="6" fill="#1e293b" opacity="0.7" stroke="#334155" />
    <text x="26" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Trade-offs &amp; Edge Reality:</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Trained on 20M+ hours of physical video</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Synthesizes photorealistic robot rollouts</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Latency (4 min/action) prevents edge control</text>
    <text x="26" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Generates pretraining data for VLA policies</text>
    <text x="26" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981">Status: Physical AI Data Factory</text>
  </g>
</svg>