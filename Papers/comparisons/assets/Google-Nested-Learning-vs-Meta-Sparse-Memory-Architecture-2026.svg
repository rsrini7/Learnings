<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="scmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <text x="600" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.5">CONTINUAL LEARNING &amp; NEURAL MEMORY ARCHITECTURES</text>
  <text x="600" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Multi-Timescale Optimization (Google) vs. Sparse Memory Surgery (Meta) vs. Contextual Scaffolding (SCMS)</text>

  <!-- PANEL 1: GOOGLE NESTED LEARNING -->
  <g transform="translate(40, 100)" filter="url(#cardShadow)">
    <rect width="350" height="520" rx="12" fill="url(#googleGrad)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="20" y="20" width="310" height="42" rx="8" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="175" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Google Nested Learning (HOPE)</text>
    <text x="175" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#7dd3fc">Multi-Timescale Optimization Hierarchy</text>

    <!-- Sub-card 1: Outer Loop -->
    <rect x="20" y="78" width="310" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Outer Loop (Slow Timescale - W_s)</text>
    <text x="32" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Protects foundational syntax &amp; causal logic</text>
    <text x="32" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Low learning rate; long multi-epoch updates</text>
    <text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Objective: min L_outer(θ_slow, θ_fast*)</text>

    <!-- Flow Arrow -->
    <path d="M 175 180 L 175 194" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="171,194 179,194 175,200" fill="#38bdf8" />

    <!-- Sub-card 2: Intermediate Loop -->
    <rect x="20" y="202" width="310" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">2. Intermediate Loop (Task Scale - W_m)</text>
    <text x="32" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Consolidates domain-specific workflows</text>
    <text x="32" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Medium plasticity (η_med) across dialogues</text>
    <text x="32" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Prevents catastrophic cross-task erosion</text>

    <!-- Flow Arrow -->
    <path d="M 175 304 L 175 318" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="171,318 179,318 175,324" fill="#38bdf8" />

    <!-- Sub-card 3: Inner Loop -->
    <rect x="20" y="326" width="310" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">3. Inner Loop (Associative Memory - M_t)</text>
    <text x="32" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Associative delta update per token step</text>
    <text x="32" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• M_t = (1-α)M_{t-1} + η(v_t - M_{t-1} k_t) k_t^T</text>
    <text x="32" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Error-correcting associative retrieval</text>
    <text x="32" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• High plasticity with bounded retention</text>

    <!-- Metrics Box -->
    <rect x="20" y="448" width="310" height="52" rx="6" fill="#0c4a6e" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <text x="32" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Retention Variance: &lt; 1.5% Across 100K Steps</text>
    <text x="32" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Requires bi-level meta-gradient backpropagation</text>
  </g>

  <!-- PANEL 2: META SPARSE MEMORY FINETUNING -->
  <g transform="translate(425, 100)" filter="url(#cardShadow)">
    <rect width="350" height="520" rx="12" fill="url(#metaGrad)" stroke="#4ade80" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="20" y="20" width="310" height="42" rx="8" fill="#14532d" fill-opacity="0.25" stroke="#4ade80" stroke-width="1" />
    <text x="175" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#4ade80">Meta Sparse Memory (SMF)</text>
    <text x="175" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#86efac">Targeted Slot Surgery on MANNs</text>

    <!-- Sub-card 1: Base Transformer -->
    <rect x="20" y="78" width="310" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">1. Frozen Base Transformer (W_base)</text>
    <text x="32" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 100% frozen attention &amp; feedforward weights</text>
    <text x="32" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Zero risk of polysemantic neuron degradation</text>
    <text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Decouples core syntax from factual recall</text>

    <!-- Flow Arrow -->
    <path d="M 175 180 L 175 194" stroke="#4ade80" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="171,194 179,194 175,200" fill="#4ade80" />

    <!-- Sub-card 2: Top-K Routing -->
    <rect x="20" y="202" width="310" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">2. Top-k Sparse Key-Value Gating</text>
    <text x="32" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Query q_t = W_q · h_t selects top-k slots</text>
    <text x="32" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Slots: [m_1, m_2, ..., m_K] (K = 64..65,536)</text>
    <text x="32" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Hard routing: k=2 active slots per forward pass</text>

    <!-- Flow Arrow -->
    <path d="M 175 304 L 175 318" stroke="#4ade80" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="171,318 179,318 175,324" fill="#4ade80" />

    <!-- Sub-card 3: Memory Surgery -->
    <rect x="20" y="326" width="310" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">3. Targeted Gradient Masking</text>
    <text x="32" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Gradient Mask: G_M = ∇_M L ⊙ Mask_TopK</text>
    <text x="32" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Surgical update to activated memory slots only</text>
    <text x="32" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Inactive slots (98%+) retain zero gradient</text>
    <text x="32" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• 100% parameter isolation across tasks</text>

    <!-- Metrics Box -->
    <rect x="20" y="448" width="310" height="52" rx="6" fill="#14532d" fill-opacity="0.3" stroke="#16a34a" stroke-width="1" />
    <text x="32" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Sparsity Factor: &gt; 98% Weights Untouched</text>
    <text x="32" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Requires memory-augmented transformer architecture</text>
  </g>

  <!-- PANEL 3: SCMS CONTEXTUAL SCAFFOLDING -->
  <g transform="translate(810, 100)" filter="url(#cardShadow)">
    <rect width="350" height="520" rx="12" fill="url(#scmsGrad)" stroke="#fbbf24" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="20" y="20" width="310" height="42" rx="8" fill="#78350f" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1" />
    <text x="175" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">Contextual Scaffolding (SCMS)</text>
    <text x="175" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#fde68a">Test-Driven Developer Session Memory</text>

    <!-- Sub-card 1: Ephemeral Staging -->
    <rect x="20" y="78" width="310" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">1. Ephemeral Candidate Buffer</text>
    <text x="32" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Captures candidate patterns &amp; domain rules</text>
    <text x="32" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Staged in temporary scratchpad context</text>
    <text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Zero model weight modification (API-ready)</text>

    <!-- Flow Arrow -->
    <path d="M 175 180 L 175 194" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="171,194 179,194 175,200" fill="#fbbf24" />

    <!-- Sub-card 2: Validation Gate -->
    <rect x="20" y="202" width="310" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">2. Three-Session Validation Gate</text>
    <text x="32" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Enforces strict multi-session pattern reuse</text>
    <text x="32" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Automatically purges 87% one-off prompt clutter</text>
    <text x="32" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Prevents prompt bloating and digital attics</text>

    <!-- Flow Arrow -->
    <path d="M 175 304 L 175 318" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="171,318 179,318 175,324" fill="#fbbf24" />

    <!-- Sub-card 3: Permanent Scaffolding -->
    <rect x="20" y="326" width="310" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">3. Permanent Rule Scaffolding</text>
    <text x="32" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Battle-tested conventions promoted to AGENTS.md</text>
    <text x="32" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• High-signal, low-token modular injection</text>
    <text x="32" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 96% reimplementation speedup across IDEs</text>
    <text x="32" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• 53% token overhead reduction vs. raw dumps</text>

    <!-- Metrics Box -->
    <rect x="20" y="448" width="310" height="52" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#d97706" stroke-width="1" />
    <text x="32" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Model Agnostic: Zero Parameter Retraining</text>
    <text x="32" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Runs on Claude, Cursor, Windsurf, Copilot, &amp; ChatGPT</text>
  </g>

  <!-- BOTTOM COMPARATIVE SUMMARY -->
  <g transform="translate(40, 642)">
    <rect width="1120" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">CORE ARCHITECTURAL SYNTHESIS</text>
    <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• <tspan fill="#38bdf8" font-weight="600">Google HOPE:</tspan> Continuous multi-timescale optimization replacing flat weights with nested bi-level loops and error-correcting associative memory.</text>
    <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• <tspan fill="#4ade80" font-weight="600">Meta SMF:</tspan> Discrete targeted memory surgery isolating updates to Top-k memory slots while freezing 100% of underlying transformer weights.</text>
    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• <tspan fill="#fbbf24" font-weight="600">SCMS Scaffolding:</tspan> Test-driven context lifecycle promoting reusable patterns to permanent rules while purging 87% transient prompt noise.</text>
  </g>
</svg>