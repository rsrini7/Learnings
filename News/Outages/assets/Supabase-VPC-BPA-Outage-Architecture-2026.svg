<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d151e"/>
      <stop offset="100%" stop-color="#1f1118"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="830" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="600" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Supabase Outage: AWS VPC Block Public Access (BPA) Failure</text>
  <text x="600" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Anatomy of the February 2026 regional kill-switch misconfiguration, push-monitoring blind spot, and resolution</text>

  <!-- 3 Stages Side-by-Side -->

  <!-- Panel 1: IaC Misconfiguration -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="350" height="390" rx="10" fill="url(#redCard)" stroke="#f87171" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="42" rx="10" fill="#991b1b" fill-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">1. Control-Plane Trigger</text>
    <rect x="250" y="10" width="85" height="20" rx="4" fill="#ef4444"/>
    <text x="292" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Root Cause</text>

    <!-- Sub-card 1 -->
    <rect x="16" y="55" width="318" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Monitoring Stack Deployment</text>
    <text x="26" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Engineers roll out a routine telemetry stack</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">in us-east-2 using shared Terraform constructs.</text>
    <text x="26" y="123" font-family="monospace" font-size="9" fill="#a78bfa">Shared module enables BPA security policy</text>

    <!-- Connector -->
    <path d="M 175 140 L 175 155" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 2 -->
    <rect x="16" y="155" width="318" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Regional Scope Invocation</text>
    <text x="26" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Calls AWS EC2 Control Plane API:</text>
    <text x="26" y="208" font-family="monospace" font-size="9" fill="#fca5a5">ModifyVpcBlockPublicAccessOptions(</text>
    <text x="26" y="223" font-family="monospace" font-size="9" fill="#fca5a5">  internetGatewayMode: "block-bidirectional")</text>
    <text x="26" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fca5a5">Applied at regional account level, not VPC level!</text>

    <!-- Connector -->
    <path d="M 175 265 L 175 280" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 3 -->
    <rect x="16" y="280" width="318" height="95" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="26" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Missing Production Exemptions</text>
    <text x="26" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Exemption granted only to the monitoring VPC</text>
    <text x="26" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• All production VPCs in us-east-2 unexempted</text>
    <text x="26" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Master kill-switch severs all Internet Gateways</text>
  </g>

  <!-- Panel 2: Partition & Blind Spot -->
  <g transform="translate(425, 95)" filter="url(#shadow)">
    <rect width="350" height="390" rx="10" fill="url(#redCard)" stroke="#f87171" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="42" rx="10" fill="#991b1b" fill-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">2. Network Partition &amp; Blind Spot</text>
    <rect x="250" y="10" width="85" height="20" rx="4" fill="#dc2626"/>
    <text x="292" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Step Drop</text>

    <!-- Sub-card 1 -->
    <rect x="16" y="55" width="318" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Instant Step-Function Traffic Drop</text>
    <text x="26" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">21:12 UTC: ALB request counts drop to zero.</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Over 20 production subnets lose all ingress/egress.</text>
    <text x="26" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fca5a5">Stateful termination severing active connections</text>

    <!-- Connector -->
    <path d="M 175 140 L 175 155" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 2 -->
    <rect x="16" y="155" width="318" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">Push-Based Monitoring Blind Spot</text>
    <text x="26" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Internal daemons push metrics out via IGW:</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• When egress died, metric pipelines died</text>
    <text x="26" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• System silence was misinterpreted as health</text>
    <text x="26" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fca5a5">Initial detection delayed by 14 minutes!</text>

    <!-- Connector -->
    <path d="M 175 265 L 175 280" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 3 -->
    <rect x="16" y="280" width="318" height="95" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="26" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Cascading AWS API Failures</text>
    <text x="26" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Internal services blocked from AWS public APIs</text>
    <text x="26" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Postgres, Auth, Storage, Edge Functions drop</text>
    <text x="26" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• CloudTrail search hampered by deployment noise</text>
  </g>

  <!-- Panel 3: Resolution & SRE Lessons -->
  <g transform="translate(810, 95)" filter="url(#shadow)">
    <rect width="350" height="390" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="42" rx="10" fill="#047857" fill-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">3. Resolution &amp; Recovery</text>
    <rect x="250" y="10" width="85" height="20" rx="4" fill="#059669"/>
    <text x="292" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Restored</text>

    <!-- Sub-card 1 -->
    <rect x="16" y="55" width="318" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Root Cause Identified (00:39 UTC)</text>
    <text x="26" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Correlating IaC deployment timestamp with</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">CloudTrail event reveals the regional BPA toggle.</text>
    <text x="26" y="123" font-family="monospace" font-size="9" fill="#10b981">Triage took ~3 hours due to API misdirection</text>

    <!-- Connector -->
    <path d="M 175 140 L 175 155" stroke="#10b981" stroke-width="2"/>

    <!-- Sub-card 2 -->
    <rect x="16" y="155" width="318" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">Emergency Mitigation (00:50 UTC)</text>
    <text x="26" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Engineers destroy new monitoring stack and</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">revert BPA to allow bidirectional traffic:</text>
    <text x="26" y="223" font-family="monospace" font-size="9" fill="#a78bfa">aws ec2 modify-vpc-block-public-access-options \</text>
    <text x="26" y="243" font-family="monospace" font-size="9" fill="#a78bfa">  --internet-gateway-mode off</text>

    <!-- Connector -->
    <path d="M 175 265 L 175 280" stroke="#10b981" stroke-width="2"/>

    <!-- Sub-card 3 -->
    <rect x="16" y="280" width="318" height="95" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="26" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Core Services Normal (00:57 UTC)</text>
    <text x="26" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• API error rates normalize within 7 minutes</text>
    <text x="26" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Total customer impact: 3h 42m window</text>
    <text x="26" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• 4.92% of global tenant base impacted</text>
  </g>

  <!-- Bottom Panel: SRE Guardrails Blueprint -->
  <g transform="translate(40, 510)" filter="url(#shadow)">
    <rect width="1120" height="280" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="40" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="24" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#bae6fd">SRE Defensive Blueprint: Service Control Policies, Pull-Based Synthetics &amp; Blast-Radius Containment</text>

    <!-- Sub-panel 1: AWS Organizations SCP -->
    <rect x="24" y="55" width="330" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Nuclear-Tier Guardrail (SCP)</text>
    <text x="40" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Enforce AWS Service Control Policy (SCP)</text>
    <text x="40" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Deny ModifyVpcBlockPublicAccessOptions</text>
    <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Require break-glass IAM role with dual approval</text>
    <text x="40" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Blocks automated pipelines from touching BPA</text>
    <rect x="40" y="185" width="298" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="50" y="205" font-family="monospace" font-size="10" fill="#38bdf8">"Effect": "Deny", "Action":</text>
    <text x="50" y="223" font-family="monospace" font-size="10" fill="#38bdf8">["ec2:ModifyVpcBlockPublicAccessOptions"]</text>

    <!-- Sub-panel 2: Pull-Based Synthetics -->
    <rect x="374" y="55" width="350" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="390" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">2. External Pull-Based Synthetics</text>
    <text x="390" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Never rely strictly on in-region push telemetry</text>
    <text x="390" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Multi-cloud synthetic probes (GCP / Datadog)</text>
    <text x="390" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Probes database port 5432 &amp; API /health externally</text>
    <text x="390" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Dead-man switch alerts when push signals vanish</text>
    <rect x="390" y="185" width="318" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="400" y="205" font-family="monospace" font-size="10" fill="#a78bfa">alert_if_no_metrics_received_within(60s)</text>
    <text x="400" y="223" font-family="monospace" font-size="10" fill="#a78bfa">synthetic_probe_from("gcp-us-central1")</text>

    <!-- Sub-panel 3: Network Isolation & PrivateLink -->
    <rect x="744" y="55" width="350" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="760" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">3. PrivateLink &amp; VPC Peering Resilience</text>
    <text x="760" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• BPA only blocks Internet Gateway traffic</text>
    <text x="760" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• PrivateLink, Transit Gateway &amp; Peering survived</text>
    <text x="760" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Use AWS VPC Endpoints for S3, STS, and KMS</text>
    <text x="760" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Prevents internet routing dependency on cloud APIs</text>
    <rect x="760" y="185" width="318" height="55" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="770" y="205" font-family="monospace" font-size="10" fill="#86efac">aws ec2 create-vpc-endpoint \</text>
    <text x="770" y="223" font-family="monospace" font-size="10" fill="#86efac">  --service-name com.amazonaws.us-east-2.s3</text>
  </g>
  <!-- Footer Attribution -->
  <text x="600" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Incident Research &amp; Architecture: Srinivasan Ragothaman (@rsrini7)</text>
</svg>