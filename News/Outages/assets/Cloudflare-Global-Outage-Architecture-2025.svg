<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d151e"/>
      <stop offset="100%" stop-color="#1f1118"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="830" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="600" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Cloudflare Global Edge Outage: ClickHouse Desync &amp; Flap Loop</text>
  <text x="600" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Anatomy of the November 18, 2025 ClickHouse RBAC change, duplicate config push, and global proxy crash loop</text>

  <!-- 3 Stages Side-by-Side -->

  <!-- Panel 1: ClickHouse Query Bug -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="350" height="390" rx="10" fill="url(#redCard)" stroke="#f87171" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="42" rx="10" fill="#991b1b" fill-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">1. ClickHouse Query Desync</text>
    <rect x="250" y="10" width="85" height="20" rx="4" fill="#ef4444"/>
    <text x="292" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Root Cause</text>

    <!-- Sub-card 1 -->
    <rect x="16" y="55" width="318" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Routine RBAC Permissions Update</text>
    <text x="26" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Database engineer runs standard privilege update</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">to tighten security on ClickHouse cluster tables.</text>
    <text x="26" y="123" font-family="monospace" font-size="9" fill="#a78bfa">REVOKE ALL ON database.* FROM 'botmgmt_reader'</text>

    <!-- Connector -->
    <path d="M 175 140 L 175 155" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 2 -->
    <rect x="16" y="155" width="318" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Scope Bug: Shard-Level Duplication</text>
    <text x="26" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Automated bot rule generator changes scope:</text>
    <text x="26" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Intended: SELECT * FROM metadata.features</text>
    <text x="26" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Bug: SELECT * FROM shards.metadata.features</text>
    <text x="26" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fca5a5">Queries every shard directly, duplicating records!</text>

    <!-- Connector -->
    <path d="M 175 265 L 175 280" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 3 -->
    <rect x="16" y="280" width="318" height="95" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="26" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Oversized Config Output</text>
    <text x="26" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Rule count balloons from ~60 to 200+ rules</text>
    <text x="26" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Identical rules repeated for every DB shard</text>
    <text x="26" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Zero schema or length validation on build!</text>
  </g>

  <!-- Panel 2: Global Push & Flap Loop -->
  <g transform="translate(425, 95)" filter="url(#shadow)">
    <rect width="350" height="390" rx="10" fill="url(#redCard)" stroke="#f87171" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="42" rx="10" fill="#991b1b" fill-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">2. Global Distribution &amp; Crash</text>
    <rect x="250" y="10" width="85" height="20" rx="4" fill="#dc2626"/>
    <text x="292" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">330+ PoPs</text>

    <!-- Sub-card 1 -->
    <rect x="16" y="55" width="318" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">5-Minute Automated Distribution</text>
    <text x="26" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Config pipeline auto-deploys via background cron</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">directly to all 330+ data centers simultaneously.</text>
    <text x="26" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fca5a5">Homogeneous rollout: zero canaried staging!</text>

    <!-- Connector -->
    <path d="M 175 140 L 175 155" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 2 -->
    <rect x="16" y="155" width="318" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">Rust Proxy Assertion Panic</text>
    <text x="26" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Edge bot mitigation proxy attempts to parse JSON:</text>
    <text x="26" y="208" font-family="monospace" font-size="9.5" fill="#fca5a5">assert!(config["rules"].len() &lt; 128);</text>
    <text x="26" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Hardcoded buffer limit exceeded -&gt; Immediate PANIC!</text>
    <text x="26" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Proxy process terminates abruptly</text>

    <!-- Connector -->
    <path d="M 175 265 L 175 280" stroke="#f87171" stroke-width="2"/>

    <!-- Sub-card 3 -->
    <rect x="16" y="280" width="318" height="95" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="26" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Infinite Flap Loop &amp; Global Drop</text>
    <text x="26" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Systemd restarts proxy automatically</text>
    <text x="26" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• Proxy reloads broken config -&gt; crashes again</text>
    <text x="26" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecaca">• WAF, DDoS, and HTTP ingress fail globally</text>
  </g>

  <!-- Panel 3: Recovery & Defense -->
  <g transform="translate(810, 95)" filter="url(#shadow)">
    <rect width="350" height="390" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="42" rx="10" fill="#047857" fill-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">3. Remediation &amp; Recovery</text>
    <rect x="250" y="10" width="85" height="20" rx="4" fill="#059669"/>
    <text x="292" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Stabilized</text>

    <!-- Sub-card 1 -->
    <rect x="16" y="55" width="318" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Emergency Distribution Freeze</text>
    <text x="26" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">SREs kill automated 5-minute distribution job</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">to prevent further corrupted pushes to the edge.</text>
    <text x="26" y="123" font-family="monospace" font-size="9" fill="#10b981">systemctl stop cloudflare-config-sync</text>

    <!-- Connector -->
    <path d="M 175 140 L 175 155" stroke="#10b981" stroke-width="2"/>

    <!-- Sub-card 2 -->
    <rect x="16" y="155" width="318" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">Last-Known-Good Manual Rollback</text>
    <text x="26" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Engineers push verified pre-outage config snapshot:</text>
    <text x="26" y="208" font-family="monospace" font-size="9" fill="#a78bfa">cloudflarectl config upload \</text>
    <text x="26" y="223" font-family="monospace" font-size="9" fill="#a78bfa">  --service=botmgmt --file=good.json</text>
    <text x="26" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a7f3d0">Proxies reload cleanly; flap loop terminated</text>

    <!-- Connector -->
    <path d="M 175 265 L 175 280" stroke="#10b981" stroke-width="2"/>

    <!-- Sub-card 3 -->
    <rect x="16" y="280" width="318" height="95" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="26" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Global Traffic Normalization</text>
    <text x="26" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Edge services stabilize within minutes</text>
    <text x="26" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• WAF, CDN, and DNS traffic restored</text>
    <text x="26" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Post-mortem mandates canaried deployments</text>
  </g>

  <!-- Bottom Panel: Architectural Guardrails -->
  <g transform="translate(40, 510)" filter="url(#shadow)">
    <rect width="1120" height="280" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="40" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="24" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#bae6fd">Defensive Engineering Blueprint: Semantic Validation, Canary Rollouts &amp; Fault Containment</text>

    <!-- Sub-panel 1: Pre-Deployment Schema Bounds -->
    <rect x="24" y="55" width="330" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Semantic Schema Validation</text>
    <text x="40" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Strict max-items enforcement on JSON arrays</text>
    <text x="40" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Duplicate ID detection at build time</text>
    <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Reject configs with diffs &gt; 20% rule variance</text>
    <text x="40" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Enforce schema tests in CI before artifact release</text>
    <rect x="40" y="185" width="298" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="50" y="205" font-family="monospace" font-size="10" fill="#38bdf8">"rules": { "type": "array",</text>
    <text x="50" y="223" font-family="monospace" font-size="10" fill="#38bdf8">  "maxItems": 100, "uniqueItems": true }</text>

    <!-- Sub-panel 2: Staged Canary Rollout -->
    <rect x="374" y="55" width="350" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="390" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">2. Phased Canary Pipeline</text>
    <text x="390" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Never push configurations globally in one shot</text>
    <text x="390" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Stage 1: Deploy to single isolated PoP (Canary)</text>
    <text x="390" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Stage 2: 10% edge data centers with 5-minute soak</text>
    <text x="390" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Automatic rollback on daemon exit code &gt; 0</text>
    <rect x="390" y="185" width="318" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="400" y="205" font-family="monospace" font-size="10" fill="#a78bfa">canary_soak_period = 300s;</text>
    <text x="400" y="223" font-family="monospace" font-size="10" fill="#a78bfa">if (proxy_crashes &gt; 0) abort_rollout();</text>

    <!-- Sub-panel 3: Self-Healing Fallback -->
    <rect x="744" y="55" width="350" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="760" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80">3. Last-Known-Good Fallback</text>
    <text x="760" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Proxy must never panic on malformed config</text>
    <text x="760" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Catch parse exceptions and retain running state</text>
    <text x="760" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Fall back to LKG file stored locally in /var/run</text>
    <text x="760" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">• Emit critical alert while continuing to route</text>
    <rect x="760" y="185" width="318" height="55" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="770" y="205" font-family="monospace" font-size="10" fill="#86efac">match parse_config(&amp;new_cfg) {</text>
    <text x="770" y="223" font-family="monospace" font-size="10" fill="#86efac">  Err(_) =&gt; load_lkg_config(), ...</text>
  </g>
  <!-- Footer Attribution -->
  <text x="600" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Incident Research &amp; Architecture: Srinivasan Ragothaman (@rsrini7)</text>
</svg>