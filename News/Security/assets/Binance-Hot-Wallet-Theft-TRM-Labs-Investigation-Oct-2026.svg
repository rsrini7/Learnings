    </text>

    <rect x="16" y="140" width="513" height="66" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="28" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">
      Signing Service API Injection
    </text>
    <text x="28" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">
      Injected malicious withdrawal commands into the signing daemon;
    </text>
    <text x="28" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">
