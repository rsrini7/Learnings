<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGradRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#2d151d" />
    </linearGradient>
    <linearGradient id="cardGradBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="cardGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0e3328" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Title & Banner -->
  <text x="40" y="45" font-size="22" font-weight="700" fill="url(#headerGrad)">React Server Components RCE (GHSA-xqc2-xf4c-x3h3) &amp; Architectural Immunity</text>
  <text x="40" y="70" font-size="13" fill="#94a3b8">Flight Protocol Framing Desync with Typed Arrays, the PHP vs Node.js Debate, and Safe Architecture Patterns</text>

  <!-- PANEL 1: Attack Vector (Left) -->
  <rect x="40" y="95" width="360" height="570" rx="10" fill="url(#cardGradRed)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="55" y="110" width="200" height="24" rx="4" fill="#ef4444" fill-opacity="0.2" />
  <text x="65" y="126" font-size="11" font-weight="700" fill="#f87171">VULNERABILITY MECHANISM</text>
  <text x="55" y="155" font-size="16" font-weight="700" fill="#f8fafc">Flight Protocol Framing Desync</text>
  <text x="55" y="175" font-size="12" fill="#94a3b8">React Server DOM (Webpack / Turbopack / Parcel)</text>

  <!-- Payload Box -->
  <rect x="55" y="195" width="330" height="110" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="68" y="215" font-size="11" font-weight="600" fill="#38bdf8">Incoming Malicious Flight Request</text>
  <text x="68" y="235" font-size="11" font-family="monospace" fill="#fca5a5">POST /_flight HTTP/1.1 (or Server Action)</text>
  <text x="68" y="253" font-size="11" font-family="monospace" fill="#fca5a5">Chunk 1: [TypedArray 1: Int32Array (Header)]</text>
  <text x="68" y="271" font-size="11" font-family="monospace" fill="#fca5a5">Chunk 2: [TypedArray 2: Raw Buffer Desync]</text>
  <text x="68" y="289" font-size="11" font-family="monospace" fill="#fca5a5">Chunk 3: [Injected Constructor / Thenable]</text>

  <!-- Arrow -->
  <line x1="220" y1="305" x2="220" y2="330" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)" />

  <!-- Deserializer Flaw Box -->
  <rect x="55" y="335" width="330" height="135" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="68" y="355" font-size="12" font-weight="700" fill="#f87171">React Server DOM Decoder Confusion</text>
  <text x="68" y="375" font-size="11" fill="#cbd5e1">1. Multiple binary chunks streamed concurrently</text>
  <text x="68" y="393" font-size="11" fill="#cbd5e1">2. TypedArray boundary length parser desyncs</text>
  <text x="68" y="411" font-size="11" fill="#cbd5e1">3. Attacker payload slips into object resolver</text>
  <text x="68" y="429" font-size="11" fill="#cbd5e1">4. Property lookup resolves unsafe constructor</text>
  <text x="68" y="447" font-size="11" font-weight="600" fill="#f87171">Result: Unauthenticated Server RCE (CVSS 9.5)</text>

  <!-- Impact Note -->
  <rect x="55" y="485" width="330" height="160" rx="6" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1" />
  <text x="68" y="508" font-size="12" font-weight="700" fill="#a5b4fc">Affected Surfaces &amp; Frameworks</text>
  <text x="68" y="528" font-size="11" fill="#cbd5e1">&#8226; react-server-dom-*: 19.0.0-19.3.0</text>
  <text x="68" y="546" font-size="11" fill="#cbd5e1">&#8226; Next.js 16 App Router (use cache): &lt; 16.4.1</text>
  <text x="68" y="564" font-size="11" fill="#cbd5e1">&#8226; Next.js 15 App Router: &lt; 15.5.28</text>
  <text x="68" y="582" font-size="11" fill="#cbd5e1">&#8226; Next.js Image Optimization SVG RCE (CVE-2026-96889)</text>
  <text x="68" y="605" font-size="11" font-weight="600" fill="#38bdf8">Patches: React 19.0.9+, Next.js 16.4.5+</text>
  <text x="68" y="623" font-size="11" fill="#94a3b8">Immune: Client-only SPAs &amp; Static Exports</text>

  <!-- PANEL 2: Runtime Comparison (Center) -->
  <rect x="420" y="95" width="360" height="570" rx="10" fill="url(#cardGradBlue)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="435" y="110" width="190" height="24" rx="4" fill="#38bdf8" fill-opacity="0.2" />
  <text x="445" y="126" font-size="11" font-weight="700" fill="#38bdf8">RUNTIME THREAT MODELS</text>
  <text x="435" y="155" font-size="16" font-weight="700" fill="#f8fafc">PHP vs Node.js / React Server</text>
  <text x="435" y="175" font-size="12" fill="#94a3b8">Shared-Nothing vs Persistent Heap Analysis</text>

  <!-- PHP Box -->
  <rect x="435" y="195" width="330" height="205" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="448" y="218" font-size="13" font-weight="700" fill="#fbbf24">PHP-FPM: Shared-Nothing Model</text>
  <text x="448" y="238" font-size="11" fill="#cbd5e1">&#10003; Process destroyed on request completion</text>
  <text x="448" y="256" font-size="11" fill="#cbd5e1">&#10003; No prototype pollution or shared heap</text>
  <text x="448" y="274" font-size="11" fill="#cbd5e1">&#10003; Renders HTML; no streaming object protocol</text>
  <text x="448" y="296" font-size="11" fill="#f87171">&#10007; C Runtime UAF vulnerabilities (PHP2Shell)</text>
  <text x="448" y="314" font-size="11" fill="#f87171">&#10007; Legacy unserialize() POP gadget RCEs</text>
  <text x="448" y="332" font-size="11" fill="#f87171">&#10007; LFI, SQLi &amp; loose typing risks</text>
  <text x="448" y="355" font-size="11" font-weight="600" fill="#94a3b8">Verdict: Isolates memory per request, but C-level flaws</text>
  <text x="448" y="373" font-size="11" font-weight="600" fill="#94a3b8">yield direct OS execution.</text>

  <!-- Node.js RSC Box -->
  <rect x="435" y="415" width="330" height="230" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="448" y="438" font-size="13" font-weight="700" fill="#f87171">Node.js + RSC: Persistent Event Loop</text>
  <text x="448" y="458" font-size="11" fill="#cbd5e1">&#10003; Single language frontend + backend</text>
  <text x="448" y="476" font-size="11" fill="#cbd5e1">&#10003; Streaming UI &amp; component-level caching</text>
  <text x="448" y="498" font-size="11" fill="#f87171">&#10007; Single long-lived heap handles all tenants</text>
  <text x="448" y="516" font-size="11" fill="#f87171">&#10007; Prototype pollution infects subsequent requests</text>
  <text x="448" y="534" font-size="11" fill="#f87171">&#10007; Complex Flight wire deserialization of objects</text>
  <text x="448" y="552" font-size="11" fill="#f87171">&#10007; Blurs client/server trust boundary ("use server")</text>
  <text x="448" y="574" font-size="11" font-weight="600" fill="#94a3b8">Verdict: Persistent memory amplifies deserialization</text>
  <text x="448" y="592" font-size="11" font-weight="600" fill="#94a3b8">flaws; requires strict architectural containment.</text>

  <!-- PANEL 3: Architecture Alternatives (Right) -->
  <rect x="800" y="95" width="360" height="570" rx="10" fill="url(#cardGradGreen)" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="815" y="110" width="200" height="24" rx="4" fill="#4ade80" fill-opacity="0.2" />
  <text x="825" y="126" font-size="11" font-weight="700" fill="#4ade80">DEFENSIVE ARCHITECTURES</text>
  <text x="815" y="155" font-size="16" font-weight="700" fill="#f8fafc">5 Patterns for Total Immunity</text>
  <text x="815" y="175" font-size="12" fill="#94a3b8">Decoupling React from Server Flaws</text>

  <!-- Item 1 -->
  <rect x="815" y="195" width="330" height="78" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1" />
  <text x="828" y="215" font-size="12" font-weight="700" fill="#4ade80">1. Client-Only SPA (Vite / CRA)</text>
  <text x="828" y="233" font-size="11" fill="#cbd5e1">Zero server-side JS runtime. Static files on CDN.</text>
  <text x="828" y="251" font-size="11" font-weight="600" fill="#38bdf8">&#10003; 100% immune to Flight RCE &amp; Node.js bugs</text>

  <!-- Item 2 -->
  <rect x="815" y="282" width="330" height="78" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="828" y="302" font-size="12" font-weight="700" fill="#f8fafc">2. Static Site Generation (SSG / Astro)</text>
  <text x="828" y="320" font-size="11" fill="#cbd5e1">Prerendered at CI build time; static CDN serving.</text>
  <text x="828" y="338" font-size="11" font-weight="600" fill="#38bdf8">&#10003; No server-side request execution; fast SEO</text>

  <!-- Item 3 -->
  <rect x="815" y="369" width="330" height="78" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="828" y="389" font-size="12" font-weight="700" fill="#f8fafc">3. Decoupled Backend (React + Java/Go)</text>
  <text x="828" y="407" font-size="11" fill="#cbd5e1">React on browser, Spring Boot / Go on backend.</text>
  <text x="828" y="425" font-size="11" font-weight="600" fill="#38bdf8">&#10003; Strict JSON/REST; no object deserialization</text>

  <!-- Item 4 -->
  <rect x="815" y="456" width="330" height="78" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="828" y="476" font-size="12" font-weight="700" fill="#f8fafc">4. Traditional SSR (React Router v7 / Remix)</text>
  <text x="828" y="494" font-size="11" fill="#cbd5e1">Renders plain HTML without Flight wire streaming.</text>
  <text x="828" y="512" font-size="11" font-weight="600" fill="#38bdf8">&#10003; Standard HTTP forms; no TypedArray desync</text>

  <!-- Item 5 -->
  <rect x="815" y="543" width="330" height="102" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="828" y="563" font-size="12" font-weight="700" fill="#f8fafc">5. Hardened RSC (If Next.js is Mandatory)</text>
  <text x="828" y="581" font-size="11" fill="#cbd5e1">&#8226; Upgrade to React 19.0.9+ &amp; Next.js 16.4.5+</text>
  <text x="828" y="599" font-size="11" fill="#cbd5e1">&#8226; Isolate via V8 Workers / Firecracker MicroVMs</text>
  <text x="828" y="617" font-size="11" fill="#cbd5e1">&#8226; WAF inspection for malformed multipart chunks</text>
</svg>