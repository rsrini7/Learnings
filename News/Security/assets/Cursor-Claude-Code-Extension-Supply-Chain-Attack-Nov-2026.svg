<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .panel { fill: #111827; stroke: #1e293b; stroke-width: 1.5; rx: 8px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 6px; }
      .card-red { fill: #1e293b; stroke: #ef4444; stroke-width: 1.3; rx: 6px; }
      .card-amber { fill: #1e293b; stroke: #f59e0b; stroke-width: 1.3; rx: 6px; }
      .card-green { fill: #1e293b; stroke: #22c55e; stroke-width: 1.3; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
      .sec-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #a5b4fc; }
      .tag-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #f87171; }
      .tag-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #fbbf24; }
      .tag-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #4ade80; }
      .tag-cyan { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; }
      .arrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #ef4444; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-amber { stroke: #f59e0b; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-amber); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" class="bg" />

  <!-- Header -->
  <text x="36" y="42" class="title">Cursor &amp; Claude Code Extension Supply-Chain Attack (Oct–Nov 2026)</text>
  <text x="36" y="65" class="subtitle">Multi-hop vendor trace compromise, marketplace cache poisoning (v2.1.312 / v2.1.313), and systemic IDE Extension Host risks</text>

  <!-- Row 1 Panel: Upstream Pivot Chain -->
  <rect x="36" y="86" width="1128" height="205" class="panel" />
  <text x="54" y="112" class="sec-title">1. Upstream Pivot Chain: Inference Vendor Trace Leak to Marketplace Cache Tampering</text>

  <!-- Step 1.1 -->
  <rect x="54" y="128" width="250" height="145" class="card-red" />
  <text x="68" y="150" class="tag-red">STAGE A: VENDOR KEY EXPOSURE</text>
  <text x="68" y="170" class="card-title">Fireworks AI Breach</text>
  <text x="68" y="190" class="body">Attacker obtained a Cursor-issued</text>
  <text x="68" y="206" class="body">access key exposed at Fireworks AI</text>
  <text x="68" y="222" class="body">(two Aug–Oct 2026 incidents).</text>
  <text x="68" y="246" class="mono">Scope: Read-only data bucket key</text>
  <text x="68" y="261" class="mono">Live inference &amp; ZDR unaffected</text>

  <line x1="304" y1="200" x2="332" y2="200" class="arrow-red" />

  <!-- Step 1.2 -->
  <rect x="336" y="128" width="255" height="145" class="card-amber" />
  <text x="350" y="150" class="tag-amber">STAGE B: TRACE HARVESTING</text>
  <text x="350" y="170" class="card-title">2025 Coding Agent Traces</text>
  <text x="350" y="190" class="body">Read-only bucket held historical</text>
  <text x="350" y="206" class="body">non-Privacy-Mode traces (&lt;0.05%).</text>
  <text x="350" y="222" class="body">A subset (&lt;0.01% users) contained</text>
  <text x="350" y="238" class="body">unredacted API credentials.</text>
  <text x="350" y="261" class="mono">Pivot: Traces -&gt; Internal tokens</text>

  <line x1="591" y1="200" x2="619" y2="200" class="arrow-amber" />

  <!-- Step 1.3 -->
  <rect x="623" y="128" width="250" height="145" class="card-red" />
  <text x="637" y="150" class="tag-red">STAGE C: SAAS LATERAL MOVE</text>
  <text x="637" y="170" class="card-title">Cursor Internal Tools</text>
  <text x="637" y="190" class="body">Harvested tokens granted access to</text>
  <text x="637" y="206" class="body">select SaaS tools, archived repos,</text>
  <text x="637" y="222" class="body">support logs, and marketplace</text>
  <text x="637" y="238" class="body">cache deployment credentials.</text>
  <text x="637" y="261" class="mono">Prod release signing keys safe</text>

  <line x1="873" y1="200" x2="901" y2="200" class="arrow-red" />

  <!-- Step 1.4 -->
  <rect x="905" y="128" width="241" height="145" class="card-red" />
  <text x="919" y="150" class="tag-red">STAGE D: CACHE POISONING</text>
  <text x="919" y="170" class="card-title">Oct 29 (~11h Window)</text>
  <text x="919" y="190" class="body">Trojanized Anthropic.claude-code</text>
  <text x="919" y="206" class="body">v2.1.312 &amp; v2.1.313 placed directly</text>
  <text x="919" y="222" class="body">on Cursor marketplace cache.</text>
  <text x="919" y="246" class="mono">Open VSX / MS / npm: Clean</text>
  <text x="919" y="261" class="mono">Exposed: &lt;= 5,000 installations</text>

  <!-- Row 2 Panel: Endpoint Payload & Execution -->
  <rect x="36" y="310" width="560" height="295" class="panel" />
  <text x="54" y="336" class="sec-title">2. Endpoint Execution: Trojanized Extension Host</text>

  <rect x="54" y="352" width="524" height="106" class="card-red" />
  <text x="68" y="374" class="tag-red">SYNCHRONOUS IIFE IN EXTENSION.JS (NO USER PROMPT)</text>
  <text x="68" y="394" class="body">66-line obfuscated IIFE prepended to minified extension.js runs immediately on IDE</text>
  <text x="68" y="410" class="body">module load via unsandboxed Node.js APIs (os, fs, child_process, http, crypto).</text>
  <text x="68" y="432" class="mono">SHA-256: ecb58cb29078d9646ad1dcdbe51526f2d9cfea06be5fb2ab183e8ecc3ab6bf15</text>
  <text x="68" y="447" class="mono">Exfil POST: http://134.209.82.225:8099/beacon (host, env names, git, IP)</text>

  <rect x="54" y="472" width="254" height="118" class="card" />
  <text x="68" y="494" class="tag-amber">PERSISTENCE &amp; SSH KEY</text>
  <text x="68" y="514" class="body">Appends svc-telemetry ed25519 key</text>
  <text x="68" y="530" class="body">to ~/.ssh/authorized_keys (no \n).</text>
  <text x="68" y="548" class="mono">macOS: com.apple.sysmond.plist</text>
  <text x="68" y="563" class="mono">Win: Task \SysMon + sysmon.cmd</text>
  <text x="68" y="578" class="mono">Linux: @reboot ~/.config/.smt</text>

  <rect x="324" y="472" width="254" height="118" class="card" />
  <text x="338" y="494" class="tag-cyan">REVERSE TUNNEL &amp; BARRIERS</text>
  <text x="338" y="514" class="body">Retries ssh -N -R '*:0:localhost:22'</text>
  <text x="338" y="530" class="body">to tunnel@134.209.82.225 every 60s.</text>
  <text x="338" y="548" class="mono">Fails on non-admin hosts when</text>
  <text x="338" y="563" class="mono">enabling sshd; still exposes</text>
  <text x="338" y="578" class="mono">pre-existing localhost:22 listeners.</text>

  <!-- Row 2 Right Panel: The Bigger Systemic Problem -->
  <rect x="614" y="310" width="550" height="295" class="panel" />
  <text x="632" y="336" class="sec-title">3. The Bigger Problem: Systemic AI IDE Attack Surface</text>

  <rect x="632" y="352" width="514" height="106" class="card-amber" />
  <text x="646" y="374" class="tag-amber">BLIND SPOT 1: UNSANDBOXED EXTENSION HOSTS</text>
  <text x="646" y="394" class="body">VS Code forks execute extensions as full-privilege local user processes.</text>
  <text x="646" y="410" class="body">Silent auto-updates mean one poisoned marketplace cache gives immediate</text>
  <text x="646" y="426" class="body">read/write access to ~/.ssh, ~/.aws, .env files, and Git credentials.</text>
  <text x="646" y="446" class="mono">Gap: No mandatory client-side VSIX signature or capability sandbox.</text>

  <rect x="632" y="472" width="514" height="118" class="card-amber" />
  <text x="646" y="494" class="tag-amber">BLIND SPOT 2: PRE-TRUST AGENT CONFIGS &amp; TRACE SINKS</text>
  <text x="646" y="514" class="body">Even authentic agent CLIs faced pre-trust repo flaws (CVE-2025-59536,</text>
  <text x="646" y="530" class="body">CVE-2026-21852) executing .mcp.json hooks or ANTHROPIC_BASE_URL</text>
  <text x="646" y="546" class="body">redirects before user confirmation. Meanwhile, unredacted agent traces</text>
  <text x="646" y="562" class="body">shared with vendors create shadow credential stores outside IAM rotation.</text>
  <text x="646" y="580" class="mono">Risk: Marketplace cache + repo hooks converge on identical host trust.</text>

  <!-- Row 3 Panel: Hardening & Defense Controls -->
  <rect x="36" y="624" width="1128" height="210" class="panel" />
  <text x="54" y="650" class="sec-title">4. Defense-in-Depth Architecture for AI Coding Workstations &amp; Vendors</text>

  <rect x="54" y="668" width="262" height="146" class="card-green" />
  <text x="68" y="690" class="tag-green">1. CRYPTOGRAPHIC PROVENANCE</text>
  <text x="68" y="710" class="body">Verify publisher VSIX signatures and</text>
  <text x="68" y="726" class="body">Sigstore attestations client-side;</text>
  <text x="68" y="742" class="body">never rely solely on CDN/cache trust.</text>
  <text x="68" y="766" class="mono">Control: Disable auto-update</text>
  <text x="68" y="782" class="mono">Pin verified extension hashes</text>
  <text x="68" y="798" class="mono">Allowlist approved extension IDs</text>

  <rect x="330" y="668" width="262" height="146" class="card-green" />
  <text x="344" y="690" class="tag-green">2. WORKSPACE SANDBOXING</text>
  <text x="344" y="710" class="body">Run AI agents and IDE extensions</text>
  <text x="344" y="726" class="body">inside rootless Devcontainers or</text>
  <text x="344" y="742" class="body">ephemeral microVMs, not bare hosts.</text>
  <text x="344" y="766" class="mono">Control: Isolate ~/.ssh &amp; ~/.aws</text>
  <text x="344" y="782" class="mono">Use --cap-drop=ALL + no-new-privs</text>
  <text x="344" y="798" class="mono">Block egress to unknown IPs</text>

  <rect x="606" y="668" width="262" height="146" class="card-green" />
  <text x="620" y="690" class="tag-green">3. TRACE REDACTION &amp; ZDR</text>
  <text x="620" y="710" class="body">Enforce Privacy Mode / Zero Data</text>
  <text x="620" y="726" class="body">Retention; scrub regex &amp; high-entropy</text>
  <text x="620" y="742" class="body">secrets before vendor storage.</text>
  <text x="620" y="766" class="mono">Control: Short-lived OIDC tokens</text>
  <text x="620" y="782" class="mono">HTTP egress credential proxies</text>
  <text x="620" y="798" class="mono">Zero static keys in agent env</text>

  <rect x="882" y="668" width="264" height="146" class="card-green" />
  <text x="896" y="690" class="tag-green">4. ENDPOINT VERIFICATION</text>
  <text x="896" y="710" class="body">Uninstalling an extension leaves</text>
  <text x="896" y="726" class="body">LaunchAgents, tasks &amp; keys intact.</text>
  <text x="896" y="742" class="body">Audit disk &amp; rotate all host secrets.</text>
  <text x="896" y="766" class="mono">Audit: svc-telemetry in auth_keys</text>
  <text x="896" y="782" class="mono">Audit: com.apple.sysmond / SysMon</text>
  <text x="896" y="798" class="mono">Audit: Egress to 134.209.82.225</text>
</svg>
