<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">MCP's 2024 to 2026 upgrade map</title>
  <desc id="desc">A dated core protocol foundation supports stable, beta, and experimental extensions. Tool Search and Code Mode sit in the agent host layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="760" rx="24" fill="#0b0f19"/>
  <text x="60" y="58" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="30" font-weight="700">MCP's 2024–2026 Upgrade Map</text>
  <text x="60" y="88" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">The dated core protocol, optional extensions, and agent-host features have different release paths.</text>

  <rect x="60" y="126" width="430" height="178" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="82" y="160" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">2024–2025 · Core foundation</text>
  <text x="82" y="197" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Tools, Resources, Prompts</text>
  <text x="82" y="222" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Remote HTTP and authorization</text>
  <text x="82" y="247" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Structured output and Elicitation</text>
  <text x="82" y="272" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Dated specs retain compatibility paths</text>

  <path d="M500 215 H565" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="585" y="126" width="430" height="178" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="607" y="160" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">2026-07-28 · Core shift</text>
  <text x="607" y="197" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Stateless request lifecycle</text>
  <text x="607" y="222" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Discovery, routing headers, cache hints</text>
  <text x="607" y="247" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">MRTR for client input and continuation</text>
  <text x="607" y="272" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Auth hardening and deprecation policy</text>

  <path d="M1025 215 H1090" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1110" y="126" width="430" height="178" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="1132" y="160" fill="#fbbf24" font-family="Arial, sans-serif" font-size="18" font-weight="700">Agent host and model APIs</text>
  <text x="1132" y="197" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Tool Search and deferred schemas</text>
  <text x="1132" y="222" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Programmatic Tool Calling / Code Mode</text>
  <text x="1132" y="247" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Not part of MCP's core wire protocol</text>
  <text x="1132" y="272" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Host and vendor support determines use</text>

  <text x="60" y="365" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="700">Extension maturity as of November 2026</text>
  <path d="M800 304 V340 H290 V386 M800 340 V386 M800 340 H1310 V386" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" marker-end="url(#arrow)"/>

  <rect x="60" y="402" width="465" height="220" rx="16" fill="#10251f" stroke="#4ade80" stroke-width="2"/>
  <text x="84" y="439" fill="#4ade80" font-family="Arial, sans-serif" font-size="19" font-weight="700">Stable extensions</text>
  <text x="84" y="478" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">MCP Apps · interactive UI · Jan</text>
  <text x="84" y="510" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Tasks · durable async handles · Jul</text>
  <text x="84" y="542" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">EMA · centralized IdP access · Jun</text>
  <text x="84" y="584" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Host and server support still varies</text>

  <rect x="567" y="402" width="465" height="220" rx="16" fill="#282313" stroke="#fbbf24" stroke-width="2"/>
  <text x="591" y="439" fill="#fbbf24" font-family="Arial, sans-serif" font-size="19" font-weight="700">Beta extensions</text>
  <text x="591" y="478" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Skills · instructions and resources · Oct</text>
  <text x="591" y="510" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Events · change subscriptions · Nov</text>
  <text x="591" y="552" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Expect revisions as implementations grow</text>
  <text x="591" y="584" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Check each extension's client matrix</text>

  <rect x="1074" y="402" width="466" height="220" rx="16" fill="#251b28" stroke="#c084fc" stroke-width="2"/>
  <text x="1098" y="439" fill="#c084fc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Experimental design</text>
  <text x="1098" y="478" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">Files · out-of-band upload and download</text>
  <text x="1098" y="510" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Design announced November 10, 2026</text>
  <text x="1098" y="542" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">No reference implementation at announcement</text>
  <text x="1098" y="584" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Not a stable deployment assumption</text>

  <rect x="60" y="660" width="1480" height="56" rx="12" fill="#111827" stroke="#334155"/>
  <text x="84" y="695" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">“MCP 2.0” is informal shorthand. The project versions its core specification by date.</text>
</svg>
