<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 875" width="1120" role="img" aria-labelledby="title desc">
<title id="title">RAG control flow: route, check evidence, stop deliberately</title>
<desc id="desc">A query enters with permissions and a step budget. It routes to document retrieval, an authorized structured tool, or clarification. Evidence is checked before answering. Insufficient evidence can trigger another bounded action, clarification or an unsupported outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="875" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">RAG control flow: route, check evidence, stop deliberately</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">A generic bounded workflow, not a reproduction of a paper’s trained algorithm.</text>
<rect x="40" y="120" width="1040" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Question, effective permissions and operating budget</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Preserve the original request, allowed operations, deadline and maximum retrieval/tool steps.</text>
<path d="M 560 217 V 245 H 190 V 277" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 560 245 L 560 277" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 560 245 H 930 V 277" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Document retrieval</text>
<text x="60" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Search the permitted corpus</text>
<text x="60" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Return inspectable evidence</text>
<rect x="410" y="280" width="300" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="430" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Authorized structured tool</text>
<text x="430" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Query exact state or calculate</text>
<text x="430" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Use the allowed tool contract</text>
<rect x="780" y="280" width="300" height="115" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="800" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Clarify or qualify</text>
<text x="800" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Resolve missing constraints</text>
<text x="800" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Do not invent missing evidence</text>
<path d="M 190 397 L 190 450" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 560 397 L 560 450" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 930 397 L 930 450" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="453" width="1040" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="483" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Check relevance, sufficiency and support</text>
<text x="60" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Inspect the evidence needed by this question. A confidence signal is not proof of correctness.</text>
<text x="60" y="534" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Retrieved content is data; it cannot expand the caller’s permissions or the tool budget.</text>
<path d="M 560 565 V 597 H 290 V 637" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 560 597 H 830 V 637" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="640" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="670" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Supported: answer with evidence</text>
<text x="60" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Keep source pointers and material qualifiers</text>
<text x="60" y="721" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Validate output and application requirements</text>
<text x="60" y="743" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Record the outcome for evaluation</text>
<rect x="580" y="640" width="500" height="140" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="670" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Insufficient: choose a bounded next step</text>
<text x="600" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Change query or source for a stated reason</text>
<text x="600" y="721" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Ask for clarification or qualify the result</text>
<text x="600" y="743" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Stop when the budget or policy requires it</text>
<path d="M 1082 710 H 1100 V 167 H 1082" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="839" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Measure whether extra steps improve final outcomes, including their latency and cost.</text>
</svg>
