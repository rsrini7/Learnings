<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 910" width="1120" role="img" aria-labelledby="title desc">
<title id="title">RAG at scale: version the complete evidence lifecycle</title>
<desc id="desc">Source changes enter a versioned ingestion process. Parsing, representation and index writes precede validation and publication. Deletion and access changes must invalidate affected representations and caches. Progress and failures remain observable across stages.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="910" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">RAG at scale: version the complete evidence lifecycle</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Stable identities and publication rules matter as much as ingestion throughput.</text>
<rect x="40" y="120" width="1040" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Source identity, version and effective permissions</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Track content changes, deletions and access changes as first-class pipeline inputs.</text>
<path d="M 560 217 V 247 H 190 V 277" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="300" height="135" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Parse and chunk</text>
<text x="60" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Preserve structure and locations</text>
<text x="60" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Track parsing failures</text>
<text x="60" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Record chunking configuration</text>
<rect x="410" y="280" width="300" height="135" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="430" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Create representations</text>
<text x="430" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Compatible encoder versions</text>
<text x="430" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Derived questions or summaries</text>
<text x="430" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Retain source provenance</text>
<rect x="780" y="280" width="300" height="135" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="800" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Write indexes</text>
<text x="800" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Stable point identities</text>
<text x="800" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Track partial progress</text>
<text x="800" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Make retries safe per operation</text>
<path d="M 341 347 L 408 347" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 711 347 L 778 347" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 930 417 V 450 H 290 V 497" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="500" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="530" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Validate and publish a known version</text>
<text x="60" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Check coverage, permissions and retrieval</text>
<text x="60" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Switch the serving version deliberately</text>
<text x="60" y="603" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Acknowledge partial or quarantined inputs</text>
<rect x="580" y="500" width="500" height="140" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="530" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Apply deletion and revocation everywhere</text>
<text x="600" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Remove or exclude affected source evidence</text>
<text x="600" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Update summaries, graphs and cached results</text>
<text x="600" y="603" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Enforce serving policy during propagation</text>
<path d="M 1082 168 H 1100 V 570 H 1082" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 290 642 L 290 692" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 642 L 830 692" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="695" width="1040" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="725" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Observe the source-to-answer result</text>
<text x="60" y="754" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Track ingest delay, failed stages, query-visible versions and revocation propagation.</text>
<text x="60" y="776" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">A successful point upsert is not an atomic transaction across every index, source and cache.</text>
<text x="40" y="858" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Rebuild and rollback policies must preserve current permissions, not restore revoked access.</text>
</svg>
