<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 753" width="1120" role="img" aria-labelledby="title desc">
<title id="title">Multimodal RAG: three ways to find evidence</title>
<desc id="desc">Three parallel retrieval paths: convert media to text, use aligned multimodal embeddings, or query specialized indexes and fuse results. All paths return evidence with locations to the answer-generation step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="753" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">Multimodal RAG: three ways to find evidence</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Keep source locations through retrieval so a reader can inspect the original media.</text>
<rect x="40" y="120" width="1040" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Ingest documents, images, audio and video</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Preserve file IDs, pages, image regions, frame times and audio time ranges.</text>
<text x="40" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">CHOOSE OR COMBINE RETRIEVAL PATHS</text>
<rect x="40" y="275" width="320" height="145" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Convert media to text</text>
<text x="60" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">OCR, transcripts or captions</text>
<text x="60" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Index using text retrieval</text>
<text x="60" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Conversion can lose details</text>
<rect x="400" y="275" width="320" height="145" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="420" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Aligned embeddings</text>
<text x="420" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Encode supported modalities</text>
<text x="420" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Search a compatible space</text>
<text x="420" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Alignment depends on training</text>
<rect x="760" y="275" width="320" height="145" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="780" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Specialized indexes</text>
<text x="780" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Search each relevant index</text>
<text x="780" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Fuse or rerank candidates</text>
<text x="780" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Evaluate scores and coverage</text>
<path d="M 200 422 L 200 470" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 560 422 L 560 470" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 920 422 L 920 470" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="473" width="1040" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="503" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Assemble evidence for the user question</text>
<text x="60" y="532" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Keep the retrieved page, region or segment and its source pointer.</text>
<text x="60" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">A text summary is useful only when it preserves the information needed to answer.</text>
<path d="M 560 590 L 560 625" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="628" width="1040" height="95" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Generate and evaluate the answer</text>
<text x="60" y="687" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Check retrieval coverage first, then verify that the answer is supported by the evidence.</text>
</svg>
