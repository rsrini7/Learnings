<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="740" fill="url(#bgGrad)" rx="12" />

  <!-- Header -->
  <text x="600" y="38" fill="#f8fafc" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    AI AGENT MEMORY ARCHITECTURES: 5-LAYER HARNESS &amp; PARAMETRIC JUDGMENT GATE
  </text>
  <text x="600" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">
    Stateless LLM Core · Tiered Context &amp; Disk Artifacts · KV-Cache Economics · Online Centroid Adaptation
  </text>

  <!-- ========================================================= -->
  <!-- LEFT PANEL: 5-LAYER CONCENTRIC HARNESS MEMORY             -->
  <!-- ========================================================= -->
  <rect x="30" y="80" width="560" height="520" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="110" fill="#38bdf8" font-size="14" font-weight="700">1. THE 5-LAYER CONCENTRIC HARNESS (RETRIEVAL MEMORY)</text>
  <line x1="50" y1="120" x2="570" y2="120" stroke="#334155" stroke-width="1" />

  <!-- Concentric Rings Container -->
  <!-- Layer 5: Episodic -->
  <rect x="50" y="135" width="520" height="68" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
  <text x="65" y="158" fill="#c084fc" font-size="13" font-weight="700">5. EPISODIC MEMORY: Past (What already happened)</text>
  <text x="65" y="177" fill="#e2e8f0" font-size="11">Artifact: <tspan fill="#c084fc" class="mono">session log / SQLite FTS5</tspan> | Lifecycle: <tspan fill="#cbd5e1" font-style="italic">until deleted</tspan></text>
  <text x="65" y="193" fill="#94a3b8" font-size="10.5">Deterministic BM25 full-text search. Never preloaded; queried on-demand. Zero token bloat.</text>

  <!-- Layer 4: Procedural -->
  <rect x="50" y="211" width="520" height="68" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="65" y="234" fill="#2dd4bf" font-size="13" font-weight="700">4. PROCEDURAL MEMORY: Know (Skills it writes for itself)</text>
  <text x="65" y="253" fill="#e2e8f0" font-size="11">Artifact: <tspan fill="#2dd4bf" class="mono">SKILL.md</tspan> playbooks | Lifecycle: <tspan fill="#cbd5e1" font-style="italic">improves with use</tspan></text>
  <text x="65" y="269" fill="#94a3b8" font-size="10.5">Tiered disclosure: L0 manifest in prompt (~30 toks), L1 full playbook loaded via tool call.</text>

  <!-- Layer 3: Semantic -->
  <rect x="50" y="287" width="520" height="68" rx="8" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
  <text x="65" y="310" fill="#34d399" font-size="13" font-weight="700">3. SEMANTIC MEMORY: Know (Facts about you and project)</text>
  <text x="65" y="329" fill="#e2e8f0" font-size="11">Artifact: <tspan fill="#34d399" class="mono">MEMORY.md / USER.md</tspan> | Lifecycle: <tspan fill="#cbd5e1" font-style="italic">until edited</tspan></text>
  <text x="65" y="345" fill="#94a3b8" font-size="10.5">Hard-capped notebooks (~800 toks). Frozen at session start to preserve KV prefix cache.</text>

  <!-- Layer 2: Notes -->
  <rect x="50" y="363" width="520" height="68" rx="8" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.5" />
  <text x="65" y="386" fill="#fbbf24" font-size="13" font-weight="700">2. NOTES: Now (Saved task progress &amp; state DAG)</text>
  <text x="65" y="405" fill="#e2e8f0" font-size="11">Artifact: <tspan fill="#fbbf24" class="mono">progress.md / todo.md</tspan> | Lifecycle: <tspan fill="#cbd5e1" font-style="italic">this task</tspan></text>
  <text x="65" y="421" fill="#94a3b8" font-size="10.5">Out-of-band disk state machine. Survives rolling context compactions and crash resets.</text>

  <!-- Layer 1: Context -->
  <rect x="50" y="439" width="520" height="68" rx="8" fill="#ea580c" fill-opacity="0.25" stroke="#f97316" stroke-width="1.5" />
  <text x="65" y="462" fill="#f97316" font-size="13" font-weight="700">1. CONTEXT: Now (Active token buffer &amp; scratchpad)</text>
  <text x="65" y="481" fill="#e2e8f0" font-size="11">Artifact: <tspan fill="#f97316" class="mono">prompt</tspan> (system + turns) | Lifecycle: <tspan fill="#cbd5e1" font-style="italic">this session</tspan></text>
  <text x="65" y="497" fill="#94a3b8" font-size="10.5">Rolling compaction: middle-of-turn summarization; protects prefix cache &amp; recent tokens.</text>

  <!-- Center Core: LLM -->
  <rect x="135" y="517" width="350" height="65" rx="8" fill="url(#coreGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="310" y="542" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">FOUNDATION MODEL (CORE LLM)</text>
  <text x="310" y="561" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">STATELESS: REMEMBERS NOTHING</text>
  <text x="310" y="575" fill="#94a3b8" font-size="9.5" text-anchor="middle">Pure function: tokens in ➔ tokens out. State must be externalized to disk.</text>


  <!-- ========================================================= -->
  <!-- RIGHT PANEL: JUDGMENT MEMORY & PARAMETRIC ADAPTATION      -->
  <!-- ========================================================= -->
  <rect x="610" y="80" width="560" height="520" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
  <text x="630" y="110" fill="#34d399" font-size="14" font-weight="700">2. JUDGMENT MEMORY: PARAMETRIC DECISION GATE (ONE EQUATION)</text>
  <line x1="630" y1="120" x2="1150" y2="120" stroke="#334155" stroke-width="1" />

  <!-- The Problem & Solution Statement -->
  <rect x="630" y="135" width="520" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="645" y="154" fill="#fbbf24" font-size="11.5" font-weight="700">The 1,000-Day Static Ceiling:</text>
  <text x="645" y="171" fill="#cbd5e1" font-size="10.5">Retrieval memory only recalls facts; it does NOT calibrate decision boundaries over time.</text>

  <!-- Step 1: Distance Scoring -->
  <rect x="630" y="193" width="520" height="66" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="645" y="213" fill="#38bdf8" font-size="12" font-weight="700">Step 1 · Feature Scoring (Distance to Learned Centroid μ_c)</text>
  <text x="645" y="235" fill="#f8fafc" font-size="13" font-weight="600" class="mono">P(act | f, c) = softmax( - || f - μ_c ||² / τ )</text>
  <text x="645" y="251" fill="#94a3b8" font-size="10.5">Calculates Euclidean/cosine proximity in embedding space to "what good looks like".</text>

  <!-- Step 2: Conservation Gate -->
  <rect x="630" y="269" width="520" height="66" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
  <text x="645" y="289" fill="#fbbf24" font-size="12" font-weight="700">Step 2 · Conservation Gate (Act vs. Abstain / Escalate)</text>
  <text x="645" y="311" fill="#f8fafc" font-size="12.5" font-weight="600" class="mono">if score ≥ θ_min ➔ Execute Action; else ➔ Escalate to Human</text>
  <text x="645" y="327" fill="#94a3b8" font-size="10.5">Prevents hallucinated drift; gates tool execution based on calibrated certainty.</text>

  <!-- Step 3: Online Reshaping Equation -->
  <rect x="630" y="345" width="520" height="78" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="645" y="365" fill="#34d399" font-size="12" font-weight="700">Step 3 · Online Centroid Reshaping (Ground-Truth Feedback y ∈ {+1, -1})</text>
  <text x="645" y="388" fill="#34d399" font-size="14" font-weight="700" class="mono">μ_c ⟵ μ_c + η · y · (v - μ_c)</text>
  <text x="645" y="405" fill="#94a3b8" font-size="10.5">Asymmetric rates: Confirmations (η = 0.05, +5%) vs Overrides (η = 0.01, -1% conservative).</text>
  <text x="645" y="417" fill="#f59e0b" font-size="10.5" font-weight="600">3:1 Waste Penalty: False dismissals penalize 3× heavier than false positives.</text>

  <!-- Step 4: Sigma Fingerprint -->
  <rect x="630" y="433" width="520" height="72" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="645" y="453" fill="#c084fc" font-size="12" font-weight="700">Step 4 · The σ Fingerprint (Empirical Variance Discovery)</text>
  <text x="645" y="473" fill="#cbd5e1" font-size="11">Human Rule (MEMORY.md): "Prioritize Alert Severity #1" (Assumed High Signal)</text>
  <text x="645" y="492" fill="#c084fc" font-size="11" font-weight="600">Judgment Variance Tensor: σ(Severity) = HIGH NOISE ➔ Dampens feature weight.</text>

  <!-- Bridge connector note -->
  <rect x="630" y="515" width="520" height="67" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#818cf8" stroke-width="1" />
  <text x="645" y="535" fill="#a5b4fc" font-size="11.5" font-weight="700">THE UNIFIED ARCHITECTURE:</text>
  <text x="645" y="553" fill="#cbd5e1" font-size="10.5">• 5-Layer Text Harness: Provides continuity, prompt context, and instructions.</text>
  <text x="645" y="569" fill="#34d399" font-size="10.5">• Judgment Scorer: Calibrates execution certainty without re-training foundation weights.</text>


  <!-- ========================================================= -->
  <!-- BOTTOM PANEL: SYSTEMS ENGINEERING TRADE-OFF MATRIX         -->
  <!-- ========================================================= -->
  <rect x="30" y="615" width="1140" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="50" y="635" fill="#f8fafc" font-size="12" font-weight="700">SYSTEMS ENGINEERING &amp; KV-CACHE ECONOMICS SUMMARY</text>

  <!-- 4 Columns -->
  <g transform="translate(50, 645)">
    <text x="0" y="15" fill="#f97316" font-size="11" font-weight="700">Context Window</text>
    <text x="0" y="32" fill="#cbd5e1" font-size="10">• Append-only token buffer</text>
    <text x="0" y="47" fill="#cbd5e1" font-size="10">• Compaction @ 75% limit</text>
    <text x="0" y="62" fill="#94a3b8" font-size="10">• Protects system prompt</text>
  </g>

  <g transform="translate(320, 645)">
    <text x="0" y="15" fill="#fbbf24" font-size="11" font-weight="700">Notes (progress.md)</text>
    <text x="0" y="32" fill="#cbd5e1" font-size="10">• Out-of-band disk state</text>
    <text x="0" y="47" fill="#cbd5e1" font-size="10">• Checkpoint DAG transitions</text>
    <text x="0" y="62" fill="#94a3b8" font-size="10">• Zero prefix-cache invalidation</text>
  </g>

  <g transform="translate(600, 645)">
    <text x="0" y="15" fill="#34d399" font-size="11" font-weight="700">Semantic &amp; Procedural</text>
    <text x="0" y="32" fill="#cbd5e1" font-size="10">• MEMORY.md: ~800 tok ceiling</text>
    <text x="0" y="47" fill="#cbd5e1" font-size="10">• SKILL.md: Tiered progressive</text>
    <text x="0" y="62" fill="#94a3b8" font-size="10">• Static prefix = 80-90% cache save</text>
  </g>

  <g transform="translate(890, 645)">
    <text x="0" y="15" fill="#c084fc" font-size="11" font-weight="700">Episodic &amp; Judgment</text>
    <text x="0" y="32" fill="#cbd5e1" font-size="10">• SQLite FTS5 (BM25 deterministic)</text>
    <text x="0" y="47" fill="#cbd5e1" font-size="10">• Parametric Centroid Gate</text>
    <text x="0" y="62" fill="#94a3b8" font-size="10">• O(1) latency, zero token bloat</text>
  </g>

</svg>