<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="550" y="40" fill="#f0f6fc" font-size="22" font-weight="bold" text-anchor="middle">AI Agent Evaluation Architecture (Model vs. Product Evals)</text>
  <text x="550" y="65" fill="#8b949e" font-size="14" text-anchor="middle">Iterative workflow for testing, grading, and aligning AI agents with business rules</text>

  <!-- ==================== SECTION 1: MODEL EVALS (TOP LEFT) ==================== -->
  <rect x="40" y="95" width="260" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" />
  <rect x="55" y="83" width="150" height="24" rx="12" fill="#0d1117" stroke="#d29922" stroke-width="1.5" />
  <text x="130" y="99" fill="#d29922" font-size="12" font-weight="bold" text-anchor="middle">1. Model Evals (Filter)</text>

  <polygon points="75,122 265,122 215,176 125,176" fill="#21262d" stroke="#d29922" stroke-width="1.5" />
  <text x="170" y="142" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Public Benchmarks</text>
  <text x="170" y="158" fill="#8b949e" font-size="10" text-anchor="middle">(MMLU Pro, BIRD SQL)</text>

  <rect x="115" y="195" width="110" height="45" rx="6" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5" />
  <text x="170" y="215" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Base Model</text>
  <text x="170" y="230" fill="#8b949e" font-size="10" text-anchor="middle">DeepSeek V4.1 Flash</text>

  <line x1="170" y1="176" x2="170" y2="195" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- ==================== SECTION 2: PRODUCT EVALS & INPUTS (BOTTOM LEFT) ==================== -->
  <rect x="40" y="300" width="260" height="250" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" />
  <rect x="55" y="288" width="175" height="24" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" />
  <text x="142" y="304" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">2. Product Eval Dataset</text>

  <rect x="60" y="330" width="220" height="60" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
  <text x="170" y="352" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Standard Schema Queries</text>
  <text x="170" y="372" fill="#8b949e" font-size="11" text-anchor="middle">Answerable from tables alone</text>

  <rect x="60" y="405" width="220" height="65" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
  <text x="170" y="425" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Business-Rule Queries</text>
  <text x="170" y="443" fill="#8b949e" font-size="10" text-anchor="middle">• Fiscal year starts Feb 1st</text>
  <text x="170" y="458" fill="#8b949e" font-size="10" text-anchor="middle">• Net revenue (post-refunds) &amp; no test accts</text>

  <rect x="60" y="485" width="220" height="45" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
  <text x="170" y="505" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Real User Prompts (60-100+)</text>
  <text x="170" y="520" fill="#8b949e" font-size="10" text-anchor="middle">Typos, vague requests, missing data</text>

  <!-- ==================== SECTION 3: AI AGENT SYSTEM (CENTER) ==================== -->
  <rect x="360" y="150" width="300" height="400" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
  <rect x="375" y="138" width="180" height="24" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" />
  <text x="465" y="154" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">3. AI Agent System (SUT)</text>

  <!-- System Prompt -->
  <rect x="385" y="180" width="250" height="65" rx="6" fill="#1f2937" stroke="#bc8cff" stroke-width="1.5" />
  <text x="510" y="202" fill="#bc8cff" font-size="13" font-weight="bold" text-anchor="middle">System Prompt + Business Rules</text>
  <text x="510" y="220" fill="#8b949e" font-size="11" text-anchor="middle">Injected unwritten finance rules</text>
  <text x="510" y="235" fill="#8b949e" font-size="10" text-anchor="middle">(Updated in V2 after Error Analysis)</text>

  <!-- Agent Orchestrator -->
  <rect x="385" y="270" width="250" height="75" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
  <text x="510" y="295" fill="#f0f6fc" font-size="14" font-weight="bold" text-anchor="middle">SQL Data Agent</text>
  <text x="510" y="315" fill="#58a6ff" font-size="11" text-anchor="middle">Multi-Run Sampling (e.g., 3x per query)</text>
  <text x="510" y="332" fill="#8b949e" font-size="10" text-anchor="middle">Tracks consistency &amp; step budget</text>

  <!-- Agent Tools -->
  <rect x="385" y="370" width="118" height="55" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5" />
  <text x="444" y="393" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Tool 1</text>
  <text x="444" y="410" fill="#e6edf3" font-size="11" text-anchor="middle">list_tables()</text>

  <rect x="517" y="370" width="118" height="55" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5" />
  <text x="576" y="393" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Tool 2</text>
  <text x="576" y="410" fill="#e6edf3" font-size="11" text-anchor="middle">run_query(sql)</text>

  <!-- Company DB -->
  <rect x="385" y="455" width="250" height="70" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" />
  <text x="510" y="480" fill="#f0f6fc" font-size="12" font-weight="bold" text-anchor="middle">Company Database (Amber Roasters)</text>
  <text x="510" y="500" fill="#8b949e" font-size="11" text-anchor="middle">Tables: Customers, Products, Orders, Refunds</text>

  <!-- Internal Agent Connections -->
  <line x1="510" y1="245" x2="510" y2="270" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <line x1="444" y1="345" x2="444" y2="370" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="576" y1="345" x2="576" y2="370" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="444" y1="425" x2="444" y2="455" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="576" y1="425" x2="576" y2="455" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Connections from Left to Center -->
  <path d="M 225 217 L 330 217 L 330 295 L 385 295" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-blue)" />
  <line x1="300" y1="420" x2="360" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- ==================== SECTION 4: THE 3 GRADERS (RIGHT) ==================== -->
  <rect x="730" y="95" width="330" height="455" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2" />
  <rect x="745" y="83" width="220" height="24" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" />
  <text x="855" y="99" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">4. Evaluation &amp; Grading Layer</text>

  <!-- Step 1: Human Grader -->
  <rect x="755" y="130" width="280" height="105" rx="8" fill="#21262d" stroke="#d29922" stroke-width="2" />
  <text x="895" y="153" fill="#d29922" font-size="14" font-weight="bold" text-anchor="middle">Step 1: Human &amp; Error Analysis</text>
  <text x="895" y="173" fill="#e6edf3" font-size="11" text-anchor="middle">Read 60–100+ real agent traces</text>
  <text x="895" y="191" fill="#8b949e" font-size="11" text-anchor="middle">• Group &amp; count failure modes</text>
  <text x="895" y="207" fill="#8b949e" font-size="11" text-anchor="middle">• Establish Ground Truth pass/fail labels</text>
  <text x="895" y="223" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">Calibrates Code &amp; LLM Judges ↓</text>

  <!-- Step 2: Code Grader -->
  <rect x="755" y="265" width="280" height="105" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
  <text x="895" y="288" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Step 2: Deterministic Code Grader</text>
  <text x="895" y="308" fill="#e6edf3" font-size="11" text-anchor="middle">Fast, cheap, exact output verification</text>
  <text x="895" y="326" fill="#8b949e" font-size="11" text-anchor="middle">• Compares agent SQL rows vs. Gold SQL</text>
  <text x="895" y="342" fill="#8b949e" font-size="11" text-anchor="middle">• Checks specific numbers &amp; properties</text>
  <text x="895" y="358" fill="#f85149" font-size="10" text-anchor="middle">Warning: Watch for overly strict grader bugs!</text>

  <!-- Step 3: LLM Judge -->
  <rect x="755" y="400" width="280" height="125" rx="8" fill="#21262d" stroke="#bc8cff" stroke-width="1.5" />
  <text x="895" y="423" fill="#bc8cff" font-size="14" font-weight="bold" text-anchor="middle">Step 3: Rubric-Based LLM Judge</text>
  <text x="895" y="443" fill="#e6edf3" font-size="11" text-anchor="middle">Grades nuances &amp; high-volume traces</text>
  <text x="895" y="461" fill="#8b949e" font-size="10" text-anchor="middle">Specific Rubric (Not Naive):</text>
  <text x="895" y="477" fill="#8b949e" font-size="10" text-anchor="middle">1. Fiscal Calendar  2. Net Revenue Definition</text>
  <text x="895" y="493" fill="#8b949e" font-size="10" text-anchor="middle">3. Test Accounts   4. Missing Data Handling</text>
  <text x="895" y="512" fill="#bc8cff" font-size="10" font-weight="bold" text-anchor="middle">Tip: Use a different model family (~90% alignment)</text>

  <!-- Connections from Agent to Graders -->
  <line x1="660" y1="305" x2="730" y2="305" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="695" y="295" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">Outputs</text>

  <!-- Calibration Arrows inside Graders -->
  <line x1="895" y1="235" x2="895" y2="265" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <line x1="895" y1="370" x2="895" y2="400" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- ==================== SECTION 5: ITERATIVE FEEDBACK LOOP (BOTTOM) ==================== -->
  <path d="M 895 550 L 895 615 L 170 615 L 170 550" fill="none" stroke="#bc8cff" stroke-width="2" stroke-dasharray="6" marker-end="url(#arrow-purple)" />
  <path d="M 510 615 L 510 550" fill="none" stroke="#bc8cff" stroke-width="2" stroke-dasharray="6" marker-end="url(#arrow-purple)" />

  <rect x="310" y="590" width="460" height="45" rx="22" fill="#1f2937" stroke="#bc8cff" stroke-width="2" />
  <text x="540" y="610" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">5. Continuous Regression &amp; Iteration Loop</text>
  <text x="540" y="626" fill="#bc8cff" font-size="11" text-anchor="middle">Fix Prompt/Tools/Graders ➔ Add New Failures to Dataset ➔ Rerun Entire Eval Suite</text>
</svg>
