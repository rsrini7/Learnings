<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="policyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="45" font-size="24" font-weight="bold" fill="#ffffff">Production Agentic AI Memory Architecture</text>
  <text x="50" y="70" font-size="14" fill="#94a3b8">Decoupling Storage from Governance, Policies, and State Lifecycles</text>

  <!-- LAYER 1: AGENT RUNTIME & BOUNDARY -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="900" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="25" y="30" font-size="16" font-weight="bold" fill="#38bdf8">1. Agent Runtime &amp; Tenant Boundary</text>
    <text x="25" y="50" font-size="12" fill="#94a3b8">Enforces tenant isolation, scoping, and request contexts before hitting any memory layer.</text>
    
    <rect x="25" y="65" width="260" height="30" rx="6" fill="#0f172a" stroke="#475569" />
    <text x="155" y="85" font-size="12" fill="#e2e8f0" text-anchor="middle">Request &amp; Tenant ID Context</text>

    <rect x="310" y="65" width="260" height="30" rx="6" fill="#0f172a" stroke="#475569" />
    <text x="440" y="85" font-size="12" fill="#e2e8f0" text-anchor="middle">Access Boundary Filter</text>

    <rect x="595" y="65" width="280" height="30" rx="6" fill="#0f172a" stroke="#475569" />
    <text x="735" y="85" font-size="12" fill="#e2e8f0" text-anchor="middle">Context Budget / Token Enforcer</text>
  </g>

  <!-- Arrow down -->
  <path d="M 500 215 L 500 240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" />

  <!-- LAYER 2: POLICY & GOVERNANCE ENGINE -->
  <g transform="translate(50, 245)" filter="url(#shadow)">
    <rect width="900" height="130" rx="12" fill="url(#policyGrad)" opacity="0.95" />
    <text x="25" y="30" font-size="16" font-weight="bold" fill="#ffffff">2. Policy &amp; Governance Engine (The Core Guardrails)</text>
    <text x="25" y="50" font-size="12" fill="#e2e8f0">Decides what enters the system, what decays, and what gets retrieved with strict thresholds.</text>

    <rect x="25" y="70" width="200" height="42" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="125" y="96" font-size="12" font-weight="bold" fill="#f3e8ff" text-anchor="middle">Write Policy (Conservative)</text>

    <rect x="235" y="70" width="210" height="42" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="340" y="96" font-size="12" font-weight="bold" fill="#f3e8ff" text-anchor="middle">Retrieval Policy (0.7 Threshold)</text>

    <rect x="455" y="70" width="210" height="42" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="560" y="96" font-size="12" font-weight="bold" fill="#f3e8ff" text-anchor="middle">Aging &amp; Decay Engine</text>

    <rect x="675" y="70" width="200" height="42" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="775" y="96" font-size="12" font-weight="bold" fill="#f3e8ff" text-anchor="middle">Conflict Resolution (Prov+Rec)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 500 380 L 500 405" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" />

  <!-- LAYER 3: MULTI-TIER MEMORY STACK -->
  <g transform="translate(50, 410)" filter="url(#shadow)">
    <rect width="900" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="25" y="30" font-size="16" font-weight="bold" fill="#34d399">3. Multi-Tier Memory Stack (Storage Backends)</text>
    <text x="25" y="50" font-size="12" fill="#94a3b8">Differentiated stores tailored to lifespan, structure, and transactional needs.</text>

    <!-- Box 1: Short-term -->
    <rect x="25" y="70" width="200" height="105" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <text x="125" y="95" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Short-Term / Working</text>
    <text x="125" y="115" font-size="11" fill="#94a3b8" text-anchor="middle">• Trajectory context</text>
    <text x="125" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">• Protected tool results</text>
    <text x="125" y="149" font-size="11" fill="#94a3b8" text-anchor="middle">Backend: Volatile / Redis</text>

    <!-- Box 2: Episodic -->
    <rect x="235" y="70" width="200" height="105" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <text x="335" y="95" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Episodic Memory</text>
    <text x="335" y="115" font-size="11" fill="#94a3b8" text-anchor="middle">• Past session events</text>
    <text x="335" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">• Recent raw + summaries</text>
    <text x="335" y="149" font-size="11" fill="#94a3b8" text-anchor="middle">Backend: Relational + Vector</text>

    <!-- Box 3: Semantic & Entity -->
    <rect x="445" y="70" width="210" height="105" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <text x="550" y="95" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Semantic / Entity Memory</text>
    <text x="550" y="115" font-size="11" fill="#94a3b8" text-anchor="middle">• User assertions &amp; facts</text>
    <text x="550" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">• Provenance &amp; half-life</text>
    <text x="550" y="149" font-size="11" fill="#94a3b8" text-anchor="middle">Backend: Knowledge Graph</text>

    <!-- Box 4: Retrieval / RAG -->
    <rect x="665" y="70" width="210" height="105" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <text x="770" y="95" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Retrieval &amp; Cache Store</text>
    <text x="770" y="115" font-size="11" fill="#94a3b8" text-anchor="middle">• Document index &amp; RAG</text>
    <text x="770" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">• Metadata filters + Rerank</text>
    <text x="770" y="149" font-size="11" fill="#94a3b8" text-anchor="middle">Backend: Vector DB + Cache</text>
  </g>

  <!-- Footer Legend -->
  <text x="50" y="640" font-size="12" fill="#64748b">Key Architectural Rule: Never let raw database writes bypass the Governance Engine; isolate tenants at the read boundary.</text>
</svg>