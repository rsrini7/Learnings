<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 732" width="1120" role="img" aria-labelledby="title desc">
<title id="title">FlashAttention: change data movement, keep exact attention</title>
<desc id="desc">The baseline stores large attention intermediates in HBM. FlashAttention tiles queries, keys and values into on-chip memory and accumulates output using online softmax without storing the complete score matrix. Dense pairwise work remains quadratic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="732" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">FlashAttention: change data movement, keep exact attention</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Conceptual comparison with a straightforward implementation that materializes attention matrices.</text>
<text x="40" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">STRAIGHTFORWARD IMPLEMENTATION</text>
<text x="580" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">FLASHATTENTION</text>
<rect x="40" y="140" width="500" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Read queries, keys and values</text>
<text x="60" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Compute pairwise attention scores</text>
<text x="60" y="221" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Materialize score and probability matrices</text>
<rect x="580" y="140" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Load tiles from HBM</text>
<text x="600" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Reuse blocks in fast on-chip memory</text>
<text x="600" y="221" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Combine results with online softmax</text>
<path d="M 290 257 L 290 300" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 257 L 830 300" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="303" width="500" height="115" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="60" y="333" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Store large intermediates in HBM</text>
<text x="60" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Attention matrices grow with N × N</text>
<text x="60" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Read them again to compute the output</text>
<rect x="580" y="303" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="333" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Accumulate the attention output</text>
<text x="600" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Avoid the full N × N matrix in HBM</text>
<text x="600" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Recompute selected values in backward pass</text>
<path d="M 290 420 L 290 463" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 420 L 830 463" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="466" width="500" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="496" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Cost to watch</text>
<text x="60" y="525" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Quadratic attention intermediates</text>
<text x="60" y="547" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Data movement can limit execution speed</text>
<rect x="580" y="466" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="496" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Benefit and remaining limit</text>
<text x="600" y="525" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Lower intermediate memory and HBM traffic</text>
<text x="600" y="547" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Dense pairwise computation remains quadratic</text>
<rect x="40" y="615" width="1040" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="645" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Measure the complete model workload</text>
<text x="60" y="674" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Speed depends on hardware, shape and precision. Context length also depends on model and serving design.</text>
</svg>
