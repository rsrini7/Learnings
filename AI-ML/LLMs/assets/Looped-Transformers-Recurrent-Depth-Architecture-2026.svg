<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1570" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="990" height="72" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="525" y="50" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">LOOPED TRANSFORMERS: RECURRENT DEPTH &amp; LATENT REASONING</text>
  <text x="525" y="74" fill="#94a3b8" font-size="12" text-anchor="middle">Decoupling parameter storage from computational depth through shared layers</text>

  <!-- ==================== PANEL 1: ARCHITECTURAL PARADIGM ==================== -->
  <rect x="30" y="110" width="990" height="340" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="137" fill="#38bdf8" font-size="14" font-weight="bold">1. STRUCTURAL TOPOLOGY: STANDARD FEEDFORWARD VS. SANDWICH LOOPED STACK</text>

  <!-- Left: Standard Deep Transformer -->
  <rect x="50" y="155" width="455" height="275" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="277" y="180" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Standard Linear Deep Transformer (L Layers)</text>
  
  <rect x="75" y="200" width="405" height="28" rx="4" fill="#334155" stroke="#475569" />
  <text x="277" y="218" fill="#e2e8f0" font-size="11" text-anchor="middle">Input Embedding &amp; Positional Encoding</text>
  
  <rect x="75" y="235" width="405" height="32" rx="4" fill="#1e3a8a" stroke="#2563eb" />
  <text x="277" y="255" fill="#93c5fd" font-size="11" text-anchor="middle">Physical Layer 1 (Unique Weights θ_1)</text>

  <rect x="75" y="274" width="405" height="32" rx="4" fill="#1e3a8a" stroke="#2563eb" />
  <text x="277" y="294" fill="#93c5fd" font-size="11" text-anchor="middle">Physical Layer 2 (Unique Weights θ_2)</text>

  <text x="277" y="325" fill="#64748b" font-size="14" font-weight="bold" text-anchor="middle">⋮ (L Distinct Layers Stacked Linearly)</text>

  <rect x="75" y="340" width="405" height="32" rx="4" fill="#1e3a8a" stroke="#2563eb" />
  <text x="277" y="360" fill="#93c5fd" font-size="11" text-anchor="middle">Physical Layer L (Unique Weights θ_L)</text>

  <rect x="75" y="380" width="405" height="28" rx="4" fill="#334155" stroke="#475569" />
  <text x="277" y="398" fill="#e2e8f0" font-size="11" text-anchor="middle">Final Unembedding / Language Modeling Head</text>

  <text x="277" y="422" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">Parameter Storage: O(L) | Effective Compute Depth: L</text>

  <!-- Right: Sandwich Looped Transformer -->
  <rect x="545" y="155" width="455" height="275" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="772" y="180" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Sandwich Looped Transformer (Prelude-Core-Coda)</text>

  <rect x="570" y="200" width="405" height="28" rx="4" fill="#065f46" stroke="#059669" />
  <text x="772" y="218" fill="#a7f3d0" font-size="11" text-anchor="middle">Prelude: Fixed Projection Layers (L_prelude)</text>

  <rect x="570" y="238" width="405" height="95" rx="6" fill="#1e1e38" stroke="#8b5cf6" stroke-width="2" />
  <text x="772" y="258" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">RECURRENT CORE BLOCK (M Layers, Shared θ_core)</text>
  <rect x="590" y="268" width="365" height="24" rx="4" fill="#312e81" />
  <text x="772" y="284" fill="#e0e7ff" font-size="10" text-anchor="middle">Pass k = 1: Hidden State h^(1) = Core(h^(0))</text>
  <rect x="590" y="298" width="365" height="24" rx="4" fill="#312e81" />
  <text x="772" y="314" fill="#e0e7ff" font-size="10" text-anchor="middle">Pass k = 2..K: Recurrent Latent Refinement</text>

  <!-- Looping Arc Indicator -->
  <path d="M 930 310 C 960 310, 960 270, 930 270" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="945" y="293" fill="#fbbf24" font-size="8" font-weight="bold" text-anchor="middle">Loop K×</text>

  <rect x="570" y="343" width="405" height="28" rx="4" fill="#065f46" stroke="#059669" />
  <text x="772" y="361" fill="#a7f3d0" font-size="11" text-anchor="middle">Coda: Normalization &amp; Output Unembedding (L_coda)</text>

  <rect x="570" y="380" width="405" height="28" rx="4" fill="#334155" stroke="#475569" />
  <text x="772" y="398" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">Effective Depth: D_eff = L_pre + K × M + L_coda</text>

  <text x="772" y="422" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">Parameter Storage: O(L_pre + M + L_coda) &lt;&lt; D_eff</text>

  <!-- ==================== PANEL 2: REASONING REGIMES ==================== -->
  <rect x="30" y="470" width="990" height="340" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="497" fill="#38bdf8" font-size="14" font-weight="bold">2. REASONING REGIME: EXPLICIT TOKEN CHAIN-OF-THOUGHT VS. CONTINUOUS LATENT REASONING</text>

  <!-- Left: Explicit CoT -->
  <rect x="50" y="515" width="455" height="275" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="277" y="540" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Explicit Token-Based CoT (e.g., o1, R1, R1-Distill)</text>

  <rect x="75" y="555" width="405" height="30" rx="4" fill="#334155" />
  <text x="277" y="574" fill="#cbd5e1" font-size="11" text-anchor="middle">Input Prompt Tokens: [p_1, p_2, ..., p_n]</text>

  <path d="M 277 585 L 277 600" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />

  <rect x="75" y="605" width="405" height="60" rx="4" fill="#451a03" stroke="#b45309" />
  <text x="277" y="625" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">Sequential Generation of Discrete Reasoning Tokens</text>
  <text x="277" y="643" fill="#fcd34d" font-size="10" text-anchor="middle">"&lt;think&gt; Let x = 5... wait, check boundary... &lt;/think&gt;"</text>
  <text x="277" y="658" fill="#f59e0b" font-size="9" text-anchor="middle">More tokens increase KV cache linearly with sequence length</text>

  <path d="M 277 665 L 277 680" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />

  <rect x="75" y="685" width="405" height="30" rx="4" fill="#14532d" stroke="#16a34a" />
  <text x="277" y="704" fill="#bbf7d0" font-size="11" text-anchor="middle">Emits Final Answer: "The answer is 42."</text>

  <text x="277" y="736" fill="#f87171" font-size="10" text-anchor="middle">Bottlenecks: Context window bloat, verbosity tax, autoregressive latency</text>
  <text x="277" y="754" fill="#94a3b8" font-size="10" text-anchor="middle">Training and reasoning strategies vary by model</text>

  <!-- Right: Latent CoT -->
  <rect x="545" y="515" width="455" height="275" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="772" y="540" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Continuous Latent Reasoning (Huginn, Ouro, Dory)</text>

  <rect x="570" y="555" width="405" height="30" rx="4" fill="#334155" />
  <text x="772" y="574" fill="#cbd5e1" font-size="11" text-anchor="middle">Input Prompt Tokens: [p_1, p_2, ..., p_n]</text>

  <path d="M 772 585 L 772 600" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />

  <rect x="570" y="605" width="405" height="60" rx="4" fill="#2e1065" stroke="#7c3aed" />
  <text x="772" y="625" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">Internal Recurrent Trajectory in Continuous Latent Space</text>
  <text x="772" y="643" fill="#ddd6fe" font-size="10" text-anchor="middle">h_t^(0) → h_t^(1) → h_t^(2) → ... → h_t^(K)</text>
  <text x="772" y="658" fill="#a78bfa" font-size="9" text-anchor="middle">K state updates need not add tokens to the context</text>

  <path d="M 772 665 L 772 680" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)" />

  <rect x="570" y="685" width="405" height="30" rx="4" fill="#14532d" stroke="#16a34a" />
  <text x="772" y="704" fill="#bbf7d0" font-size="11" text-anchor="middle">Output tokens depend on the model and task</text>

  <text x="772" y="736" fill="#4ade80" font-size="10" text-anchor="middle">Trade-off: extra compute without extra reasoning tokens</text>
  <text x="772" y="754" fill="#94a3b8" font-size="10" text-anchor="middle">Quality and trained loop depths vary by model</text>

  <!-- ==================== PANEL 3: KV-CACHE MECHANICS ==================== -->
  <rect x="30" y="830" width="990" height="340" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="857" fill="#38bdf8" font-size="14" font-weight="bold">3. KV-CACHE LIFECYCLE: ONE POSSIBLE FINAL-PASS POLICY</text>

  <!-- Left: Pass k < K -->
  <rect x="50" y="875" width="455" height="275" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="277" y="900" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">A. Intermediate Recurrent Passes (k &lt; K)</text>

  <rect x="75" y="915" width="405" height="42" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="277" y="932" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Query Vector: q_t^(k) = h_t^(k-1) × W_q</text>
  <text x="277" y="948" fill="#cbd5e1" font-size="9" text-anchor="middle">Scores attention against past tokens' committed final KV cache</text>

  <rect x="75" y="968" width="405" height="46" rx="4" fill="#450a0a" stroke="#dc2626" />
  <text x="277" y="986" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">Ephemeral Keys &amp; Values: k_t^(k), v_t^(k)</text>
  <text x="277" y="1002" fill="#f87171" font-size="9" text-anchor="middle">Intermediate KV is not retained in the persistent cache</text>

  <rect x="75" y="1025" width="405" height="40" rx="4" fill="#1e293b" stroke="#475569" />
  <text x="277" y="1042" fill="#e2e8f0" font-size="10" text-anchor="middle">Attention: Softmax(q_t^(k) × [K_past ; k_t^(k)]^T / √d) × [V_past ; v_t^(k)]</text>
  <text x="277" y="1057" fill="#94a3b8" font-size="9" text-anchor="middle">Past tokens use the chosen stored representations</text>

  <rect x="75" y="1075" width="405" height="42" rx="4" fill="#064e3b" stroke="#059669" />
  <text x="277" y="1092" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">Persistent core cache: one set per token and layer</text>
  <text x="277" y="1108" fill="#6ee7b7" font-size="9" text-anchor="middle">Temporary buffers and peak memory may still vary</text>

  <!-- Right: Pass k = K -->
  <rect x="545" y="875" width="455" height="275" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="772" y="900" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">B. Final Terminal Recurrent Pass (k = K)</text>

  <rect x="570" y="915" width="405" height="42" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="772" y="932" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Terminal Hidden State: h_t^(K)</text>
  <text x="772" y="948" fill="#cbd5e1" font-size="9" text-anchor="middle">Convergence and quality are not guaranteed</text>

  <rect x="570" y="968" width="405" height="46" rx="4" fill="#065f46" stroke="#10b981" />
  <text x="772" y="986" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">Persistent Commit: k_t^(K), v_t^(K) → GPU HBM</text>
  <text x="772" y="1002" fill="#a7f3d0" font-size="9" text-anchor="middle">Keys and Values are written to global KV Cache for future tokens</text>

  <rect x="570" y="1025" width="405" height="40" rx="4" fill="#1e293b" stroke="#475569" />
  <text x="772" y="1042" fill="#e2e8f0" font-size="10" text-anchor="middle">Output Emitted: Coda Block computes next-token logits</text>
  <text x="772" y="1057" fill="#94a3b8" font-size="9" text-anchor="middle">Next autoregressive step (t + 1) begins afresh from Prelude</text>

  <rect x="570" y="1075" width="405" height="42" rx="4" fill="#064e3b" stroke="#059669" />
  <text x="772" y="1092" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">Persistent core KV uses one depth slot per layer</text>
  <text x="772" y="1108" fill="#6ee7b7" font-size="9" text-anchor="middle">Total KV also depends on batch, sequence length and other layers</text>

  <!-- ==================== PANEL 4: HARDWARE ARITHMETIC INTENSITY ==================== -->
  <rect x="30" y="1190" width="990" height="350" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="1217" fill="#38bdf8" font-size="14" font-weight="bold">4. HARDWARE ROOFLINE: MEASURE WEIGHT AND CACHE TRAFFIC</text>

  <!-- Left: Standard Decode -->
  <rect x="50" y="1235" width="455" height="285" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="277" y="1260" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Standard Decode: A Weight-Bound Example</text>

  <rect x="75" y="1275" width="405" height="52" rx="4" fill="#1e1e38" stroke="#475569" />
  <text x="277" y="1293" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">HBM Weight Streaming Penalty</text>
  <text x="277" y="1309" fill="#cbd5e1" font-size="9" text-anchor="middle">At small batch sizes, dense weights may be read from HBM</text>
  <text x="277" y="1322" fill="#cbd5e1" font-size="9" text-anchor="middle">Traffic depends on caching, precision and batching</text>

  <rect x="75" y="1337" width="405" height="42" rx="4" fill="#311010" stroke="#7f1d1d" />
  <text x="277" y="1355" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">BF16 weight-only estimate: ~1 FLOP / Byte</text>
  <text x="277" y="1371" fill="#f87171" font-size="9" text-anchor="middle">Actual utilization depends on hardware and workload</text>

  <rect x="75" y="1390" width="405" height="60" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="277" y="1408" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Linear Scaling Reality</text>
  <text x="277" y="1424" fill="#94a3b8" font-size="9" text-anchor="middle">More distinct layers can increase weight storage and traffic</text>
  <text x="277" y="1438" fill="#94a3b8" font-size="9" text-anchor="middle">Large models may need multiple devices</text>

  <text x="277" y="1485" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">Profile latency, HBM traffic and utilization</text>

  <!-- Right: Looped Decode -->
  <rect x="545" y="1235" width="455" height="285" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="772" y="1260" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Looped Decode: Workload-Dependent Trade-Off</text>

  <rect x="570" y="1275" width="405" height="52" rx="4" fill="#064e3b" stroke="#059669" />
  <text x="772" y="1293" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">Weight Reuse Does Not Ensure Cache Residency</text>
  <text x="772" y="1309" fill="#e0e7ff" font-size="9" text-anchor="middle">Large cores may be reloaded from HBM on each pass</text>
  <text x="772" y="1322" fill="#e0e7ff" font-size="9" text-anchor="middle">KV traffic and temporary storage also matter</text>

  <rect x="570" y="1337" width="405" height="42" rx="4" fill="#065f46" stroke="#10b981" />
  <text x="772" y="1355" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">Weight-only intensity can improve if tiles stay resident</text>
  <text x="772" y="1371" fill="#4ade80" font-size="9" text-anchor="middle">A K-fold gain requires an idealized reuse schedule</text>

  <rect x="570" y="1390" width="405" height="60" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="772" y="1408" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Stored Parameters vs. Execution Cost</text>
  <text x="772" y="1424" fill="#94a3b8" font-size="9" text-anchor="middle">Weight sharing can reduce stored model size</text>
  <text x="772" y="1438" fill="#94a3b8" font-size="9" text-anchor="middle">Fit and latency depend on precision, cache and runtime</text>

  <text x="772" y="1485" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">Measure on the target hardware</text>
</svg>
