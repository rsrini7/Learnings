<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 870" width="1120" role="img" aria-labelledby="title desc">
<title id="title">LLM inference engines: scheduling and memory</title>
<desc id="desc">An API submits model work to a scheduler, which allocates KV state and sends work to the model executor. Kernels execute on supported hardware. Output handling returns responses while measurements track latency, throughput and errors.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="870" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">LLM inference engines: scheduling and memory</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">A conceptual component map, not the internal architecture of one named product.</text>
<rect x="40" y="120" width="500" height="105" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Input and API layer</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Validate supported requests and format inputs</text>
<text x="60" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Pass admitted requests to the serving engine</text>
<rect x="580" y="120" width="500" height="105" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Start from the workload</text>
<text x="600" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Model, hardware, lengths and concurrency</text>
<text x="600" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">API features, output constraints and deadlines</text>
<path d="M 290 227 L 290 265" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="268" width="500" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="298" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Scheduler</text>
<text x="60" y="327" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Choose active decode and prompt work</text>
<text x="60" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Continuous batching admits work over time</text>
<text x="60" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Chunked prefill limits prompt scheduling units</text>
<rect x="580" y="268" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="298" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">KV memory manager</text>
<text x="600" y="327" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Allocate and reclaim attention-state blocks</text>
<text x="600" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Reuse eligible cached prefixes where supported</text>
<text x="600" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Paging and sharing reduce particular waste</text>
<path d="M 541 338 L 578 338" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 290 410 L 290 448" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 410 L 830 448" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="451" width="500" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="481" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Model executor</text>
<text x="60" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Run layers for the selected work</text>
<text x="60" y="532" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Coordinate devices in a supported layout</text>
<text x="60" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Apply generation and stopping rules</text>
<rect x="580" y="451" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="481" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Kernels and hardware</text>
<text x="600" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Compute attention and matrix operations</text>
<text x="600" y="532" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Use supported precision and memory formats</text>
<text x="600" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Communication matters across device boundaries</text>
<path d="M 541 521 L 578 521" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 290 593 L 290 631" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="634" width="500" height="105" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="664" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Output handling</text>
<text x="60" y="693" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Return or stream generated tokens</text>
<text x="60" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Release work when complete or cancelled</text>
<rect x="580" y="634" width="500" height="105" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="664" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Observe the complete system</text>
<text x="600" y="693" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Latency distributions, throughput and errors</text>
<text x="600" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Memory, queueing and cache behavior</text>
<path d="M 541 686 L 578 686" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="795" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Memory layout, arithmetic kernels and scheduling solve different problems.</text>
<text x="40" y="827" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Compare compatible deployments under recorded workloads, rather than ranking engine names.</text>
</svg>
