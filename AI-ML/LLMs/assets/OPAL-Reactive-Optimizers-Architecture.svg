<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="550" y="50" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">OPAL REACTIVE OPTIMIZERS: AGENT-IN-THE-LOOP ARCHITECTURE</text>
  <text x="550" y="74" fill="#94a3b8" font-size="12" text-anchor="middle">In-Flight Optimizer Rewriting, Diagnostic Telemetry, Multi-GPU Gloo Sync &amp; Automatic Rollback</text>

  <!-- ==================== COLUMN 1: TRAINING RUNTIME ==================== -->
  <rect x="30" y="105" width="330" height="415" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="132" fill="#38bdf8" font-size="13" font-weight="bold">1. TRAINING RUNTIME &amp; DDP INTERCEPTION</text>

  <!-- Box 1A: PyTorch DDP Cluster -->
  <rect x="45" y="145" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="195" y="168" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">PyTorch Training Cluster</text>
  <text x="195" y="188" fill="#cbd5e1" font-size="11" text-anchor="middle">Forward &amp; backward passes calculate loss</text>
  <text x="195" y="206" fill="#cbd5e1" font-size="11" text-anchor="middle">DDP ranks (0 to N) process uniform batches</text>
  <text x="195" y="235" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Rank 0 owns IPC communication channel</text>

  <!-- Box 1B: OPAL Interceptor -->
  <rect x="45" y="270" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="195" y="293" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">OPAL Optimizer Interceptor</text>
  <text x="195" y="313" fill="#cbd5e1" font-size="11" text-anchor="middle">Wraps standard optimizer: opt = opal.wrap()</text>
  <text x="195" y="331" fill="#cbd5e1" font-size="11" text-anchor="middle">Hooks step(loss=loss) and tracks trajectory</text>
  <text x="195" y="360" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Intercepts update triggers &amp; metric bounds</text>

  <!-- Box 1C: Gloo Sync & Fingerprinting -->
  <rect x="45" y="395" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="195" y="418" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">DDP Sync &amp; Parameter Auditing</text>
  <text x="195" y="438" fill="#cbd5e1" font-size="11" text-anchor="middle">Gloo broadcast group shares code updates</text>
  <text x="195" y="456" fill="#cbd5e1" font-size="11" text-anchor="middle">SHA-256 byte digests audit parameter sync</text>
  <text x="195" y="485" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">Automatic broadcast repair on divergence</text>

  <!-- ==================== COLUMN 2: WORKSPACE & SAFETY ==================== -->
  <rect x="385" y="105" width="330" height="415" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="405" y="132" fill="#4ade80" font-size="13" font-weight="bold">2. WORKSPACE &amp; SAFETY FIREWALL</text>

  <!-- Box 2A: Workspace Files -->
  <rect x="400" y="145" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="550" y="168" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Isolated Workspace Scripts</text>
  <text x="550" y="188" fill="#cbd5e1" font-size="11" text-anchor="middle">updater.py: Executable PyTorch step logic</text>
  <text x="550" y="206" fill="#cbd5e1" font-size="11" text-anchor="middle">analysis.py: Agent-authored telemetry probes</text>
  <text x="550" y="235" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">All code fully inspected before invocation</text>

  <!-- Box 2B: 20-Step Trial Window -->
  <rect x="400" y="270" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="550" y="293" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">20-Step Supervised Trial</text>
  <text x="550" y="313" fill="#cbd5e1" font-size="11" text-anchor="middle">Candidate updater runs under trial supervision</text>
  <text x="550" y="331" fill="#cbd5e1" font-size="11" text-anchor="middle">Catches runtime exceptions and NaN/Inf loss</text>
  <text x="550" y="360" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Traceback fed directly to agent on failure</text>

  <!-- Box 2C: Snapshot & Rollback -->
  <rect x="400" y="395" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="550" y="418" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Automatic Rollback Engine</text>
  <text x="550" y="438" fill="#cbd5e1" font-size="11" text-anchor="middle">Pre-trial parameter snapshot retained</text>
  <text x="550" y="456" fill="#cbd5e1" font-size="11" text-anchor="middle">Restores last stable state on trial crash</text>
  <text x="550" y="485" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">Safe fallbacks protect expensive GPU hours</text>

  <!-- ==================== COLUMN 3: AGENT BRAIN ==================== -->
  <rect x="740" y="105" width="330" height="415" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="760" y="132" fill="#fbbf24" font-size="13" font-weight="bold">3. AUTONOMOUS AGENT BRAIN</text>

  <!-- Box 3A: Claude Code Subprocess -->
  <rect x="755" y="145" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="905" y="168" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Claude Code Process (Rank 0)</text>
  <text x="905" y="188" fill="#cbd5e1" font-size="11" text-anchor="middle">Persistent multi-turn agent conversation</text>
  <text x="905" y="206" fill="#cbd5e1" font-size="11" text-anchor="middle">CLI execution: reads analysis metrics</text>
  <text x="905" y="235" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Hard budget enforcement via max_cost_usd</text>

  <!-- Box 3B: Reasoning & AST Synthesis -->
  <rect x="755" y="270" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="905" y="293" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Reasoning &amp; Dynamic Synthesis</text>
  <text x="905" y="313" fill="#cbd5e1" font-size="11" text-anchor="middle">Detects anomalies: spikes, stalls, overfitting</text>
  <text x="905" y="331" fill="#cbd5e1" font-size="11" text-anchor="middle">Synthesizes update rules (AdamW, Muon, SWA)</text>
  <text x="905" y="360" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Pivots heuristics based on empirical evidence</text>

  <!-- Box 3C: Execution Modes -->
  <rect x="755" y="395" width="300" height="110" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="905" y="418" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Execution Flow Control</text>
  <text x="905" y="438" fill="#cbd5e1" font-size="11" text-anchor="middle">Blocking: Pauses GPU loop during edits (2-3x)</text>
  <text x="905" y="456" fill="#cbd5e1" font-size="11" text-anchor="middle">Non-blocking: Async background edits (1.01x)</text>
  <text x="905" y="485" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">Hot-swaps updater at next step boundary</text>

  <!-- Connector Lines -->
  <line x1="345" y1="200" x2="400" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <line x1="700" y1="200" x2="755" y2="200" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />
  <line x1="755" y1="325" x2="700" y2="325" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <line x1="400" y1="450" x2="345" y2="450" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />

  <!-- ==================== BOTTOM PANEL: EMPIRICAL BENCHMARKS ==================== -->
  <rect x="30" y="535" width="1040" height="195" rx="10" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="562" fill="#f8fafc" font-size="13" font-weight="bold">EMPIRICAL VALIDATION &amp; EMERGENT BEHAVIORS</text>

  <!-- Card A: CIFAR-10 Sabotaged Experiment -->
  <rect x="45" y="575" width="320" height="140" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="205" y="598" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Noisy CIFAR-10 (4,500 Wrong Labels)</text>
  <text x="205" y="620" fill="#cbd5e1" font-size="11" text-anchor="middle">Fixed AdamW: 100% memorization (74.4% acc)</text>
  <text x="205" y="638" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">OPAL Claude: ~4% memorization (79.1% acc)</text>
  <text x="205" y="658" fill="#94a3b8" font-size="10" text-anchor="middle">Failed on Flooding/Noise, pivoted to SWA</text>
  <text x="205" y="688" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Cat-or-truck test: true label preserved (78%)</text>

  <!-- Card B: Generative Diffusion (DiT) -->
  <rect x="390" y="575" width="320" height="140" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="550" y="598" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">LightningDiT-XL/1 on ImageNet</text>
  <text x="550" y="620" fill="#cbd5e1" font-size="11" text-anchor="middle">Spontaneous parameter grouping &amp; routing</text>
  <text x="550" y="638" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">Swapped 2D matrix weights to Muon mid-run</text>
  <text x="550" y="658" fill="#94a3b8" font-size="10" text-anchor="middle">Retained AdamW for 1D biases and embeddings</text>
  <text x="550" y="688" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Synthesized spike guards to avoid NaN loss</text>

  <!-- Card C: Economic Tradeoff -->
  <rect x="735" y="575" width="320" height="140" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="895" y="598" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Economics: Agent Tokens vs GPU Hours</text>
  <text x="895" y="620" fill="#cbd5e1" font-size="11" text-anchor="middle">H100 run: $7.62 spend across 45.7 min (3.6x)</text>
  <text x="895" y="638" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">27.4m waiting for Claude in blocking mode</text>
  <text x="895" y="658" fill="#94a3b8" font-size="10" text-anchor="middle">Non-blocking mode drops overhead to 1.01x-1.14x</text>
  <text x="895" y="688" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Eliminates multi-run human hyperparameter grid</text>
</svg>