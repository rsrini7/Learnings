<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2a38"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purple-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1838"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emerald-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2d26"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bg-grad)"/>

  <!-- Top Title Bar -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Inside a Single Neuron: Linear Algebra, Activation Dynamics, and Backprop</text>
    <text x="30" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">The Atomic Unit of Deep Learning: Affine Projections, Decision Hyperplanes, and Gradient Updates</text>
    <rect x="980" y="20" width="115" height="30" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="1037" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Foundations 2026</text>
  </g>

  <!-- Panel 1: Affine Transformation -->
  <g transform="translate(40, 120)">
    <rect width="350" height="430" rx="10" fill="url(#blue-card)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="20" y="20" width="155" height="26" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="97" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1. AFFINE PROJECTION</text>
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Weighted Dot Product &amp; Bias</text>
    <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Linear combination in d-dimensional space</text>

    <!-- Formula Box -->
    <rect x="20" y="110" width="310" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="175" y="135" font-family="'Fira Code', monospace" font-size="13" fill="#38bdf8" text-anchor="middle">z = wᵀx + b = Σᵢ wᵢ xᵢ + b</text>
    <text x="175" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Inner product of inputs x and learned weights w</text>

    <!-- Mechanics -->
    <rect x="20" y="185" width="310" height="225" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="35" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc">Geometric Interpretation:</text>

    <text x="35" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Hyperplane Decision Boundary</text>
    <text x="45" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">The equation wᵀx + b = 0 defines a flat (d-1)</text>
    <text x="45" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">subspace that splits the input space into half-spaces.</text>

    <text x="35" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Weight Vector Orientation</text>
    <text x="45" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">The vector w points normal (perpendicular) to the</text>
    <text x="45" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">hyperplane toward the positive activation region.</text>

    <text x="35" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Bias as Spatial Offset</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Bias b translates the boundary away from the origin;</text>
    <text x="45" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">orthogonal distance from origin is -b / ||w||₂.</text>
  </g>

  <!-- Panel 2: Activation Function -->
  <g transform="translate(425, 120)">
    <rect width="350" height="430" rx="10" fill="url(#purple-card)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="26" rx="5" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1"/>
    <text x="90" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">2. NON-LINEARITY</text>
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Activation Functions</text>
    <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Bending the geometry of feature representations</text>

    <!-- Formula Box -->
    <rect x="20" y="110" width="310" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="175" y="135" font-family="'Fira Code', monospace" font-size="13" fill="#c084fc" text-anchor="middle">ŷ = σ(z) = σ(wᵀx + b)</text>
    <text x="175" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Maps unconstrained real scalars into bounded manifolds</text>

    <!-- Mechanics -->
    <rect x="20" y="185" width="310" height="225" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="35" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe">Why Non-Linearity is Vital:</text>

    <text x="35" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Preventing Linear Collapse</text>
    <text x="45" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Without non-linear σ, stacking 100 layers collapses</text>
    <text x="45" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">to W₁₀₀...W₁x = W_eff x (a single linear regression).</text>

    <text x="35" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Universal Approximation</text>
    <text x="45" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Cybenko's theorem: A single hidden layer with non-</text>
    <text x="45" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">linear σ approximates any continuous function.</text>

    <text x="35" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Modern SOTA Activations</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">LLMs have moved from Sigmoid/Tanh to GELU and</text>
    <text x="45" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">SwiGLU, maintaining non-zero gradients everywhere.</text>
  </g>

  <!-- Panel 3: Backpropagation -->
  <g transform="translate(810, 120)">
    <rect width="350" height="430" rx="10" fill="url(#emerald-card)" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="26" rx="5" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1"/>
    <text x="90" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">3. BACKPROPAGATION</text>
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Gradient Flow &amp; Learning</text>
    <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Analytical calculus via the multivariate chain rule</text>

    <!-- Formula Box -->
    <rect x="20" y="110" width="310" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="175" y="135" font-family="'Fira Code', monospace" font-size="13" fill="#4ade80" text-anchor="middle">∂L/∂w = (∂L/∂ŷ · σ'(z)) · xᵀ = δ · xᵀ</text>
    <text x="175" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Error signal δ times input feature transpose</text>

    <!-- Mechanics -->
    <rect x="20" y="185" width="310" height="225" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="35" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#86efac">Gradient Calculus Stages:</text>

    <text x="35" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Upstream Loss Gradient: ∂L/∂ŷ</text>
    <text x="45" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Quantifies prediction error (e.g. 2(ŷ - y) for MSE,</text>
    <text x="45" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">or (ŷ - y) directly for cross-entropy with sigmoid).</text>

    <text x="35" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Local Derivative Gate: σ'(z)</text>
    <text x="45" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">The slope of the activation. If σ saturated (|z| &gt;&gt; 0),</text>
    <text x="45" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">σ'(z) → 0, killing the gradient (vanishing gradient).</text>

    <text x="35" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">• Downstream Weight Update</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">w ← w - η (δ · x); b ← b - η δ.</text>
    <text x="45" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Steps weights along steepest loss descent vector.</text>
  </g>

  <!-- Bottom Panel: Comparative Matrix -->
  <g transform="translate(40, 580)">
    <rect width="1120" height="205" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Activation Function Anatomy: Formulas, Derivatives, and Dynamics</text>

    <!-- Table Header -->
    <rect x="25" y="45" width="1070" height="32" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">ACTIVATION</text>
    <text x="200" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">MATHEMATICAL FORMULA</text>
    <text x="430" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">OUTPUT RANGE</text>
    <text x="580" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">FIRST DERIVATIVE σ'(z)</text>
    <text x="820" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">GRADIENT FLOW / STATUS</text>

    <!-- Row 1: Sigmoid -->
    <text x="40" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fb7185">Sigmoid</text>
    <text x="200" y="100" font-family="'Fira Code', monospace" font-size="12" fill="#e2e8f0">1 / (1 + e⁻ᶻ)</text>
    <text x="430" y="100" font-family="'Fira Code', monospace" font-size="12" fill="#cbd5e1">(0, 1)</text>
    <text x="580" y="100" font-family="'Fira Code', monospace" font-size="12" fill="#fb7185">σ(z)(1 - σ(z)) ≤ 0.25</text>
    <text x="820" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fb7185">Severe Vanishing Gradient (|z| &gt; 4)</text>

    <!-- Row 2: Tanh -->
    <text x="40" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Tanh</text>
    <text x="200" y="128" font-family="'Fira Code', monospace" font-size="12" fill="#e2e8f0">(eᶻ - e⁻ᶻ) / (eᶻ + e⁻ᶻ)</text>
    <text x="430" y="128" font-family="'Fira Code', monospace" font-size="12" fill="#cbd5e1">(-1, 1)</text>
    <text x="580" y="128" font-family="'Fira Code', monospace" font-size="12" fill="#fbbf24">1 - tanh²(z) ≤ 1.0</text>
    <text x="820" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fbbf24">Zero-centered, Satures at tails</text>

    <!-- Row 3: ReLU -->
    <text x="40" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">ReLU</text>
    <text x="200" y="156" font-family="'Fira Code', monospace" font-size="12" fill="#e2e8f0">max(0, z)</text>
    <text x="430" y="156" font-family="'Fira Code', monospace" font-size="12" fill="#cbd5e1">[0, +∞)</text>
    <text x="580" y="156" font-family="'Fira Code', monospace" font-size="12" fill="#38bdf8">1 if z &gt; 0 else 0</text>
    <text x="820" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8">Constant gradient 1; Dying ReLU risk</text>

    <!-- Row 4: GELU / SwiGLU -->
    <text x="40" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4ade80">GELU / SwiGLU</text>
    <text x="200" y="184" font-family="'Fira Code', monospace" font-size="12" fill="#e2e8f0">z · Φ(z) = z · 0.5(1+erf(z/√2))</text>
    <text x="430" y="184" font-family="'Fira Code', monospace" font-size="12" fill="#cbd5e1">(-0.17, +∞)</text>
    <text x="580" y="184" font-family="'Fira Code', monospace" font-size="12" fill="#4ade80">Smooth non-monotonic</text>
    <text x="820" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4ade80">Modern SOTA standard in GPT-4, Llama 3</text>
  </g>
  <!-- Footer Attribution -->
  <text x="600" y="808" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Architecture &amp; Design by Srinivasan Ragothaman (@rsrini7)</text>
</svg>