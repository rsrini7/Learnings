<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%" style="background-color: #0b0f19; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="dark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" />
    </pattern>

    <!-- Markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="440" rx="12" fill="#0b0f19" />
  <rect width="860" height="440" rx="12" fill="url(#dark-grid)" />

  <!-- Title & Subtitle -->
  <text x="32" y="42" font-size="20" font-weight="700" fill="#f8fafc">Looped Transformer (Recurrent-Depth) Architecture</text>
  <text x="32" y="64" font-size="13" fill="#94a3b8">Scales latent reasoning depth at test time by reusing shared core weights across R iterations</text>

  <!-- 1. Input Embeddings Box -->
  <g filter="url(#shadow)">
    <rect x="32" y="175" width="96" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">Input</text>
    <text x="80" y="224" text-anchor="middle" font-size="11.5" fill="#94a3b8">Embeddings</text>
  </g>

  <!-- Connector: Input -> Prelude -->
  <line x1="128" y1="211" x2="158" y2="211" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 2. Prelude Block -->
  <g filter="url(#shadow)">
    <rect x="164" y="158" width="114" height="106" rx="10" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
    <text x="221" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">Prelude</text>
    <text x="221" y="204" text-anchor="middle" font-size="11" fill="#cbd5e1">L₁ Transformer</text>
    <text x="221" y="219" text-anchor="middle" font-size="11" fill="#cbd5e1">Layers</text>
    <rect x="172" y="232" width="98" height="20" rx="4" fill="#064e3b" />
    <text x="221" y="246" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6ee7b7">Unique Weights</text>
  </g>

  <!-- Connector: Prelude -> Loop -->
  <line x1="278" y1="211" x2="314" y2="211" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />
  <text x="296" y="201" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">e</text>

  <!-- 3. Recurrent Depth Loop Boundary -->
  <rect x="304" y="102" width="276" height="238" rx="14" fill="#111827" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="442" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8">RECURRENT DEPTH LOOP (R Iterations)</text>

  <!-- Adapter / Norm Circle -->
  <circle cx="332" cy="211" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="332" y="217" text-anchor="middle" font-size="16" font-weight="700" fill="#38bdf8">+</text>
  <text x="332" y="242" text-anchor="middle" font-size="10" fill="#93c5fd">Adapter /</text>
  <text x="332" y="254" text-anchor="middle" font-size="10" fill="#93c5fd">Norm</text>

  <!-- Connector: Norm -> Shared Core -->
  <line x1="346" y1="211" x2="376" y2="211" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />

  <!-- 4. Shared Core Block -->
  <g filter="url(#shadow)">
    <rect x="382" y="150" width="144" height="122" rx="10" fill="#1e1e38" stroke="#8b5cf6" stroke-width="1.8" />
    <text x="454" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#c084fc">Shared Core</text>
    <text x="454" y="200" text-anchor="middle" font-size="11.5" fill="#e0e7ff">L_core Layers</text>
    <text x="454" y="216" text-anchor="middle" font-size="11" fill="#cbd5e1">(Self-Attn + FFN)</text>
    <rect x="398" y="232" width="112" height="24" rx="5" fill="#312e81" />
    <text x="454" y="248" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a78bfa">Weight-Tied (θ)</text>
  </g>

  <!-- Recurrence Feedback Path (Looping Back) -->
  <path d="M 526 211 L 552 211 L 552 308 L 332 308 L 332 231" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)" />

  <!-- Recurrence State Update Badge -->
  <rect x="380" y="295" width="148" height="24" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="454" y="311" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fbbf24">h⁽ᵗ⁾ → h⁽ᵗ⁺¹⁾ (t &lt; R)</text>

  <!-- Terminal Exit Node -->
  <circle cx="552" cy="211" r="6" fill="#fbbf24" />
  <line x1="558" y1="211" x2="600" y2="211" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />
  <text x="581" y="198" text-anchor="middle" font-size="10.5" font-weight="600" fill="#f8fafc">t = R</text>
  <text x="581" y="228" text-anchor="middle" font-size="10" fill="#94a3b8">(Exit)</text>

  <!-- 5. Coda Block -->
  <g filter="url(#shadow)">
    <rect x="606" y="158" width="108" height="106" rx="10" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
    <text x="660" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">Coda</text>
    <text x="660" y="204" text-anchor="middle" font-size="11" fill="#cbd5e1">L₂ Transformer</text>
    <text x="660" y="219" text-anchor="middle" font-size="11" fill="#cbd5e1">Layers</text>
    <rect x="611" y="232" width="98" height="20" rx="4" fill="#064e3b" />
    <text x="660" y="246" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6ee7b7">Unique Weights</text>
  </g>

  <!-- Connector: Coda -> LM Head -->
  <line x1="714" y1="211" x2="740" y2="211" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 6. LM Head Block -->
  <g filter="url(#shadow)">
    <rect x="746" y="175" width="84" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="788" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">LM Head</text>
    <text x="788" y="224" text-anchor="middle" font-size="11.5" fill="#94a3b8">Next Token</text>
  </g>

  <!-- Bottom Summary Banner -->
  <rect x="32" y="366" width="798" height="48" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.2" />
  <text x="52" y="395" font-size="12.5" font-weight="600" fill="#f8fafc">Effective Depth:</text>
  <text x="158" y="395" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38bdf8">L_eff = L₁ + (R × L_core) + L₂</text>
  <line x1="422" y1="378" x2="422" y2="402" stroke="#334155" stroke-width="1.5" />
  <text x="442" y="395" font-size="12.5" font-weight="600" fill="#f8fafc">Stored Params:</text>
  <text x="544" y="395" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4ade80">Constant (Independent of R)</text>
</svg>
