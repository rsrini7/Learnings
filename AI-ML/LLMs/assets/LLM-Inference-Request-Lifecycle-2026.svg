<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 890" width="1120" role="img" aria-labelledby="title desc">
<title id="title">LLM inference: one request from prompt to response</title>
<desc id="desc">A request is formatted and tokenized, then queued. Prefill processes the prompt and creates key/value state. The decode loop emits tokens using that state. Streaming returns output, and tools may start a further generation request.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="890" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">LLM inference: one request from prompt to response</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Decoder-only autoregressive generation, with cached attention state reused as output grows.</text>
<rect x="40" y="120" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Application context</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Instructions and history</text>
<text x="60" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Retrieved evidence or tools</text>
<rect x="410" y="120" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="430" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Model input</text>
<text x="430" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Apply the chat template</text>
<text x="430" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Tokenize the formatted prompt</text>
<rect x="780" y="120" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="800" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Queue and scheduler</text>
<text x="800" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Wait for compute and memory</text>
<text x="800" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Admit work under active load</text>
<path d="M 341 178 L 408 178" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 711 178 L 778 178" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 930 237 V 270 H 290 V 310" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="313" width="500" height="145" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="343" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Prefill the input</text>
<text x="60" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Process the prompt positions</text>
<text x="60" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Build attention keys and values</text>
<text x="60" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Produce scores for the first output token</text>
<rect x="580" y="313" width="500" height="145" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="343" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Generate and decode</text>
<text x="600" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Select and emit a token</text>
<text x="600" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Use cached context for the next position</text>
<text x="600" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Repeat until a stopping condition is met</text>
<path d="M 541 385 L 578 385" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 290 460 L 290 505" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 460 L 830 505" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="508" width="500" height="145" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="538" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">KV cache</text>
<text x="60" y="567" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Retain earlier attention keys and values</text>
<text x="60" y="589" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Append new state as generation proceeds</text>
<text x="60" y="611" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Storage depends on sequence and architecture</text>
<rect x="580" y="508" width="500" height="145" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="538" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Return or stream the response</text>
<text x="600" y="567" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">The client receives generated output</text>
<text x="600" y="589" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Application checks or tools may follow</text>
<text x="600" y="611" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">A tool result can lead to another request</text>
<path d="M 541 582 H 560 V 430 H 578" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1040" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="60" y="730" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Measure distinct parts of the experience</text>
<text x="60" y="759" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">TTFT: delay to the first generated token. ITL or TPOT: the pace after generation starts.</text>
<text x="60" y="781" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Record end-to-end latency, throughput and errors under a defined workload and load.</text>
<text x="40" y="860" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Conceptual flow: implementations can interleave many requests and use different cache layouts.</text>
</svg>
