<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="headerPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)" />

  <!-- Header -->
  <rect x="30" y="20" width="1140" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">NANOBOT: MINIMALIST AGENT RUNTIME ARCHITECTURE</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">3,510 LOC Python Engine · MessageBus Decoupling · Plaintext Markdown State · Explicit ToolRegistry · Cron Proactivity</text>
  <rect x="980" y="38" width="170" height="30" rx="6" fill="#0369a1" />
  <text x="1065" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HKU DATA LAB (HKUDS)</text>

  <!-- COLUMN 1: INGRESS & MESSAGEBUS -->
  <g transform="translate(30, 100)">
    <rect width="330" height="475" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="330" height="36" rx="8" fill="url(#headerBlue)" />
    <text x="165" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. INGRESS &amp; MESSAGEBUS</text>

    <!-- Channels Box -->
    <rect x="15" y="50" width="300" height="135" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Pluggable Channels (Boundary Adapters)</text>
    <text x="25" y="88" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Telegram: Long polling + HTML conversion</text>
    <text x="25" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Discord: WebSocket Gateway integration</text>
    <text x="25" y="120" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• WhatsApp: Baileys library bridge via WebSocket</text>
    <text x="25" y="136" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Slack: Socket Mode + message deduplication</text>
    <text x="25" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Email: Full asynchronous IMAP/SMTP polling</text>
    <text x="25" y="170" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">allowFrom: Hard security filter on incoming sender IDs</text>

    <!-- MessageBus Decoupling Layer -->
    <rect x="15" y="195" width="300" height="155" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="215" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MessageBus (queue.py &amp; events.py)</text>
    <text x="25" y="233" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Inbound Queue: asyncio.Queue[InboundMessage]</text>
    <text x="25" y="249" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Outbound Queue: asyncio.Queue[OutboundMessage]</text>
    <text x="25" y="265" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Decouples channels completely from reasoning</text>
    <text x="25" y="281" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Normalizes platform events into standard dataclasses</text>
    <text x="25" y="297" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• AgentLoop touches zero platform-specific APIs</text>
    <text x="25" y="317" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Eliminates N × M architectural coupling</text>
    <text x="25" y="333" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Rate limiting &amp; audit hooks attach directly to queue</text>

    <!-- Metrics -->
    <rect x="15" y="360" width="300" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="380" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Runtime Footprint &amp; Auditability</text>
    <text x="25" y="398" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Total codebase: ~3,510 lines of Python</text>
    <text x="25" y="414" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Cold startup time: 0.8 seconds</text>
    <text x="25" y="430" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Base idle memory: ~45 MB RAM</text>
    <text x="25" y="446" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Entire codebase auditable in 90 minutes</text>
  </g>

  <!-- COLUMN 2: REASONING & FILE CONTEXT -->
  <g transform="translate(380, 100)">
    <rect width="440" height="475" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect width="440" height="36" rx="8" fill="url(#headerPurple)" />
    <text x="220" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. REASONING CORE &amp; PLAINTEXT STATE</text>

    <!-- AgentLoop -->
    <rect x="15" y="50" width="410" height="145" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="70" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">AgentLoop Execution Core (loop.py)</text>
    <text x="25" y="88" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Pulls InboundMessage from bus.inbound queue</text>
    <text x="25" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Loads session history from JSONL (~/.nanobot/sessions/)</text>
    <text x="25" y="120" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Evaluates LLM completion ↔ Tool call execution cycle</text>
    <text x="25" y="136" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Backfills tool results into message array as evidence</text>
    <text x="25" y="152" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">max_iterations Guard: Capped at 20 turns</text>
    <text x="25" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Prevents runaway infinite reasoning loops and API cost spikes</text>

    <!-- ContextBuilder -->
    <rect x="15" y="205" width="410" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="225" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ContextBuilder: Plaintext State on Disk (context.py)</text>
    <text x="25" y="243" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• BOOTSTRAP_FILES: IDENTITY.md, SOUL.md, USER.md, TOOLS.md</text>
    <text x="25" y="259" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Long-Term Memory: memory/MEMORY.md</text>
    <text x="25" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Ephemeral Memory: memory/YYYY-MM-DD.md (daily ledger)</text>
    <text x="25" y="291" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Progressive Skills: always=true loaded in prompt;</text>
    <text x="25" y="307" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">  specialized SKILL.md files loaded dynamically via read_file</text>
    <text x="25" y="327" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Hot-Editable: Edit markdown on disk → live next turn</text>
    <text x="25" y="343" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Git-trackable state without binary database dependencies</text>

    <!-- Provider Layer -->
    <rect x="15" y="365" width="410" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="385" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Pluggable LLM Providers (LiteLLM &amp; vLLM)</text>
    <text x="25" y="403" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Cloud Frontier: OpenAI, Anthropic, Gemini, DeepSeek, Groq</text>
    <text x="25" y="419" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Local &amp; Private: vLLM &amp; Ollama native endpoints</text>
    <text x="25" y="439" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Full Air-Gapped Operation Supported</text>
  </g>

  <!-- COLUMN 3: TOOLS & PROACTIVE SERVICES -->
  <g transform="translate(840, 100)">
    <rect width="330" height="475" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="330" height="36" rx="8" fill="url(#headerEmerald)" />
    <text x="165" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. TOOLS &amp; PROACTIVITY</text>

    <!-- ToolRegistry -->
    <rect x="15" y="50" width="300" height="155" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="70" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ToolRegistry (Unified Schema System)</text>
    <text x="25" y="88" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Converts Python classes into JSON Schema</text>
    <text x="25" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Parameter validation before tool execution</text>
    <text x="25" y="120" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Filesystem: read_file, write_file, edit_file, list_dir</text>
    <text x="25" y="136" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Shell: exec (subprocess runner)</text>
    <text x="25" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Web: web_search (Brave) &amp; web_fetch (JSON)</text>
    <text x="25" y="168" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Subagents: spawn (delegated isolated loops)</text>
    <text x="25" y="186" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Structured web_fetch returns parsed markdown/JSON</text>

    <!-- Cron & Heartbeat -->
    <rect x="15" y="215" width="300" height="135" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="235" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Cron &amp; Heartbeat (Proactivity Engine)</text>
    <text x="25" y="253" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• CronService: Scheduled tasks (~/.nanobot/cron/jobs.json)</text>
    <text x="25" y="269" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• HeartbeatService: 30-min sweep of HEARTBEAT.md</text>
    <text x="25" y="285" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Injects InboundMessage as 'system' directly into bus</text>
    <text x="25" y="301" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Acts proactively without waiting for user prompt</text>
    <text x="25" y="321" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Same Execution Pipeline as Real User Chat</text>
    <text x="25" y="337" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Reuses session loading, context building, and tools</text>

    <!-- Security Boundary -->
    <rect x="15" y="360" width="300" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="380" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Security Model &amp; Docker Boundary</text>
    <text x="25" y="398" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Regex deny list in ExecTool is fragile &amp; bypassable</text>
    <text x="25" y="414" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Mandatory Mitigation: Deploy in Docker container</text>
    <text x="25" y="430" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Subagents cannot spawn subagents (prevents fork bombs)</text>
    <text x="25" y="446" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Container namespace isolates host filesystem</text>
  </g>

  <!-- BOTTOM COMPARATIVE BANNER -->
  <g transform="translate(30, 585)">
    <rect width="1140" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">THE FIVE PILLARS OF MINIMALIST AGENT RUNTIMES</text>

    <!-- Spectrum Line -->
    <line x1="25" y1="50" x2="1115" y2="50" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <circle cx="100" cy="50" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <text x="100" y="72" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. MessageBus</text>
    <text x="100" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Decouples channel I/O</text>

    <circle cx="340" cy="50" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
    <text x="340" y="72" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. AgentLoop</text>
    <text x="340" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Reasoning &amp; evidence backfill</text>

    <circle cx="580" cy="50" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
    <text x="580" y="72" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. ContextBuilder</text>
    <text x="580" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Plaintext state on disk</text>

    <circle cx="820" cy="50" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="820" y="72" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4. ToolRegistry</text>
    <text x="820" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Dynamic JSON Schema</text>

    <circle cx="1040" cy="50" r="10" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
    <text x="1040" y="72" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5. Cron / Heartbeat</text>
    <text x="1040" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Proactive autonomous checks</text>
  </g>
</svg>