<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4ade80" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="820" fill="url(#bgGrad)" />

  <!-- Title & Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5px">AWS DeepRacer Local Architecture: GPU-Accelerated RL Simulation</text>
    <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Containerized Gazebo 3D Dynamics, SageMaker PPO Optimization, and Zero-Cloud-Cost Ubuntu Workflow</text>
  </g>

  <!-- PANEL 1: Workstation Host & Container Infrastructure (Left, x=60, w=350) -->
  <g transform="translate(60, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
    <text x="30" y="37" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">HOST INFRASTRUCTURE</text>
    
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Ubuntu &amp; GPU Subsystem</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Hardware isolation &amp; container runtime</text>

    <!-- Host Layer -->
    <g transform="translate(20, 108)">
      <rect width="310" height="110" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Host OS: Ubuntu 22.04 / 24.04 LTS</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Linux Kernel 6.x + prime-select nvidia</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• NVIDIA Proprietary Driver (535+ / 550+)</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• CUDA 12.x runtime libraries</text>
      <text x="14" y="92" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5">nvidia-smi: GPU direct passthrough enabled</text>
    </g>

    <!-- NVIDIA Container Toolkit -->
    <g transform="translate(20, 228)">
      <rect width="310" height="114" rx="6" fill="#0f172a" stroke="#76b900" stroke-width="1" />
      <text x="14" y="22" fill="#76b900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">NVIDIA Container Toolkit Layer</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• /etc/docker/daemon.json default-runtime config</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• nvidia-container-runtime hooks</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Exposes NVML &amp; tensor cores to Docker</text>
      <text x="14" y="94" fill="#76b900" font-family="'JetBrains Mono', monospace" font-size="9.5">docker run --gpus all verified</text>
    </g>

    <!-- MinIO Local S3 Emulator -->
    <g transform="translate(20, 352)">
      <rect width="310" height="114" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1" />
      <text x="14" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MinIO Local S3 Storage Bridge</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Emulates AWS S3 APIs locally (port 9000)</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Stores custom_files, reward_function.py</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Zero AWS data transfer / storage fees</text>
      <text x="14" y="94" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Local checkpoints: /bucket/Experiment11/</text>
    </g>

    <!-- Network Box -->
    <rect x="20" y="478" width="310" height="162" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="500" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Docker Swarm / Compose Bridge</text>
    <text x="32" y="520" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Swarm Init: <tspan fill="#38bdf8" font-weight="600">--advertise-addr 127.0.0.1</tspan></text>
    <text x="32" y="538" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Avoids multi-NIC interface collision on Ubuntu.</text>
    <text x="32" y="556" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Shared IPC &amp; Shared Memory:</text>
    <text x="32" y="574" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5">shm_size: 2gb for high-fps camera frames</text>
    <text x="32" y="596" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero cloud reliance: runs 100% offline</text>
    <text x="32" y="618" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Compute Cost: $0.00 / hour vs $3.50+ cloud</text>
  </g>

  <!-- PANEL 2: Containerized Simulation & PPO Loop (Middle, x=425, w=350) -->
  <g transform="translate(425, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="190" height="26" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <text x="30" y="37" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CONTAINERIZED RUNTIME</text>
    
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">RoboMaker &amp; SageMaker</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Decoupled physics and policy trainer</text>

    <!-- Container 1: RoboMaker Simulation -->
    <g transform="translate(20, 108)">
      <rect width="310" height="140" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Container 1: deepracer-robomaker</text>
      <text x="14" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• ROS (Robot Operating System) Node</text>
      <text x="14" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Gazebo 3D multi-body physics engine</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Virtual camera sensor (120° FOV, 15 FPS)</text>
      <text x="14" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Track collision &amp; off-track edge detector</text>
      <text x="14" y="104" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Output: RGB Images, LiDAR, Speed, Steer</text>
      <text x="14" y="122" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9">WebRTC KVS: Streamed to localhost:8080</text>
    </g>

    <!-- Bidirectional arrow -->
    <path d="M 175 252 L 175 272" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
    <path d="M 185 272 L 185 252" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowEmerald)" />

    <!-- Container 2: SageMaker RL Trainer -->
    <g transform="translate(20, 278)">
      <rect width="310" height="144" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="14" y="22" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Container 2: deepracer-sagemaker (GPU)</text>
      <text x="14" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Image: deepracer-sagemaker:5.0.0-gpu</text>
      <text x="14" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• RLlib / Coach distributed policy worker</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Ingests reward_function.py dynamically</text>
      <text x="14" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Computes GAE (Generalized Adv Estimator)</text>
      <text x="14" y="106" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5">PPO Clipped Surrogate Optimization</text>
      <text x="14" y="126" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9">Dispatches actions: [angle, throttle]</text>
    </g>

    <!-- Training Cycle Box -->
    <rect x="20" y="434" width="310" height="206" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="456" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Closed-Loop Step Execution</text>
    <text x="32" y="476" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">1. Action Command: <tspan fill="#4ade80">a_t ~ π(s_t)</tspan></text>
    <text x="32" y="494" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">2. Gazebo Physics Tick: <tspan fill="#38bdf8">Δt = 66 ms (15 Hz)</tspan></text>
    <text x="32" y="512" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">3. Reward Evaluation: <tspan fill="#fbbf24">r_t = reward_func(params)</tspan></text>
    <text x="32" y="530" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">4. Trajectory Replay: <tspan fill="#e2e8f0">(s_t, a_t, r_t, s_{t+1})</tspan></text>
    <text x="32" y="548" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">5. Epoch Gradient Step: <tspan fill="#4ade80">Batch 64 / Adam 1e-4</tspan></text>
    <text x="32" y="572" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9.5">Warm Restart Incremental Training:</text>
    <text x="32" y="590" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">dr-update &amp;&amp; dr-increment-training</text>
    <text x="32" y="612" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Preserves neural weights across reward tests</text>
  </g>

  <!-- PANEL 3: PPO & Reward Shaping Mechanics (Right, x=790, w=350) -->
  <g transform="translate(790, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1" />
    <text x="30" y="37" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ALGORITHM &amp; POLICY</text>
    
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">PPO &amp; Reward Shaping</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Mathematical formulation and reward functions</text>

    <!-- PPO Math Box -->
    <g transform="translate(20, 108)">
      <rect width="310" height="114" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1" />
      <text x="14" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PPO Clipped Objective Function</text>
      <text x="14" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">L_CLIP(θ) = E[ min( r_t(θ)Â_t,</text>
      <text x="14" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">           clip(r_t(θ), 1-ε, 1+ε)Â_t ) ]</text>
      <text x="14" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Probability ratio: r_t(θ) = π_θ(a|s) / π_old(a|s)</text>
      <text x="14" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Clipping factor ε = 0.2 prevents policy collapse</text>
    </g>

    <!-- 4 Reward Shaping Vectors -->
    <g transform="translate(20, 234)">
      <rect width="310" height="236" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="14" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Multi-Objective Reward Function</text>

      <rect x="14" y="34" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="50" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">1. Centerline Adherence: exp(-d^2 / σ^2)</text>
      <text x="22" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Rewards tight tracking; penalizes edge drift</text>

      <rect x="14" y="82" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="98" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">2. Waypoint Alignment: cos(θ_car - θ_track)</text>
      <text x="22" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Incentivizes anticipating racing line vectors</text>

      <rect x="14" y="130" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="146" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">3. Steering Smoothness Penalty</text>
      <text x="22" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Damps high-frequency zig-zag oscillation</text>

      <rect x="14" y="178" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="194" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">4. Speed vs. Turn Radius Modulation</text>
      <text x="22" y="208" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Incentivizes 4 m/s straights, 1.5 m/s hairpins</text>
    </g>

    <!-- Optimization Takeaways -->
    <rect x="20" y="482" width="310" height="158" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="504" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Production Tuning Insights</text>
    <text x="32" y="524" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Avoid step-function rewards; use smooth continuous</text>
    <text x="32" y="540" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">  gradients to prevent non-differentiable plateaus.</text>
    <text x="32" y="558" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Discount factor γ = 0.999 captures full track lap.</text>
    <text x="32" y="576" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Entropy β = 0.01 balances exploration vs collapse.</text>
    <text x="32" y="598" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5">Local throughput: 1,000 episodes in &lt; 2 hrs</text>
    <text x="32" y="618" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">10x faster iteration cycle than AWS Console</text>
  </g>
</svg>