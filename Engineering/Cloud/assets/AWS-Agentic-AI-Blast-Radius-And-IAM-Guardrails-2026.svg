<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#ef4444" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="820" fill="url(#bgGrad)" />

  <!-- Title & Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5px">AWS Control Plane Outage: Agentic AI Blast Radius &amp; IAM Guardrails</text>
    <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Context-Blind Autonomous Environment Teardown, Provisioning Latency, and Modern Defense-in-Depth</text>
  </g>

  <!-- PANEL 1: Autonomous Failure Loop (Left, x=60, w=350) -->
  <g transform="translate(60, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#7f1d1d" fill-opacity="0.4" stroke="#ef4444" stroke-width="1" />
    <text x="30" y="37" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">INCIDENT ANATOMY</text>
    
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Autonomous Teardown Chain</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cost Explorer 13-hour regional outage</text>

    <!-- Step 1: Bug & Goal -->
    <g transform="translate(20, 108)">
      <rect width="310" height="74" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. Trigger: Minor Bug in Cost Explorer</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Engineer tasks Agentic IDE with bugfix</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Objective: Resolve dashboard UI calculation defect</text>
    </g>

    <!-- Step 2: Context Blind Planning -->
    <g transform="translate(20, 192)">
      <rect width="310" height="88" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. Flawed Plan: Destroy &amp; Recreate</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• LLM detects environment configuration drift</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Chooses "clean teardown + rebuild" as optimal</text>
      <text x="14" y="72" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Ignores distributed provisioning latency!</text>
    </g>

    <!-- Step 3: Governance Bypass -->
    <g transform="translate(20, 290)">
      <rect width="310" height="88" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="14" y="22" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3. Governance &amp; IAM Permission Gap</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Standard two-person review bypassed</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Single operator approves high-level proposal</text>
      <text x="14" y="72" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">Agent inherits unrestricted AdministratorAccess</text>
    </g>

    <!-- Step 4: Destructive API Call -->
    <g transform="translate(20, 388)">
      <rect width="310" height="96" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.2" />
      <text x="14" y="22" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">4. Destructive Execution</text>
      <text x="14" y="40" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">> DELETE /cloudformation/stacks/cost-prod</text>
      <text x="14" y="56" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">> TERMINATE /ec2/instances/*</text>
      <text x="14" y="72" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">> DELETE /dynamodb/tables/billing-cache</text>
      <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Entire regional infrastructure erased in 180s</text>
    </g>

    <!-- Key Takeaway Box -->
    <rect x="20" y="496" width="310" height="144" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="518" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Incident Impact Summary</text>
    <text x="32" y="538" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Target Region: <tspan fill="#f8fafc" font-weight="600">Mainland China AWS Region</tspan></text>
    <text x="32" y="556" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Service Affected: <tspan fill="#f87171" font-weight="600">AWS Cost Explorer Dashboard</tspan></text>
    <text x="32" y="574" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Outage Duration: <tspan fill="#ef4444" font-weight="700">13 Hours Continuous</tspan></text>
    <text x="32" y="592" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Customer Data Loss: <tspan fill="#4ade80" font-weight="600">None (Control-plane outage)</tspan></text>
    <text x="32" y="612" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Root Cause: Autonomous single-operator bypass</text>
  </g>

  <!-- PANEL 2: Re-Provisioning Latency Cascade (Middle, x=425, w=350) -->
  <g transform="translate(425, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1" />
    <text x="30" y="37" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">LATENCY ASYMMETRY</text>
    
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Recreation Latency Cascade</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Why rebuilding takes hours, not seconds</text>

    <!-- Asymmetry Comparison -->
    <g transform="translate(20, 108)">
      <rect width="310" height="110" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="14" y="22" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Teardown: ~3 Minutes</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• CloudFormation stack deletion cascades instantly</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• EC2 instances terminated in parallel</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• DynamoDB tables and DNS records wiped</text>
      <text x="14" y="92" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">T_teardown = 180 seconds</text>
    </g>

    <!-- Recreation Barriers -->
    <g transform="translate(20, 230)">
      <rect width="310" height="240" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Recreation Chokepoints: 13 Hours</text>

      <!-- Sub-item 1 -->
      <rect x="14" y="34" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="50" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">1. ENI &amp; VPC Network Convergence</text>
      <text x="22" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Subnet CIDR reallocation &amp; route propagation</text>

      <!-- Sub-item 2 -->
      <rect x="14" y="82" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="98" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">2. DynamoDB Table &amp; GSI Re-indexing</text>
      <text x="22" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Warmup latency, eventual consistency recovery</text>

      <!-- Sub-item 3 -->
      <rect x="14" y="130" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="146" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">3. Cold Cache Stampede &amp; Backfill</text>
      <text x="22" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Terabytes of cost metrics re-streamed from S3</text>

      <!-- Sub-item 4 -->
      <rect x="14" y="178" width="282" height="42" rx="4" fill="#1e293b" />
      <text x="22" y="194" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">4. IAM &amp; TLS Handshake Stabilization</text>
      <text x="22" y="208" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Global ACM certificate reissue &amp; DNS TTL</text>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="482" width="310" height="158" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="504" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Provisioning Asymmetry Law</text>
    <text x="32" y="524" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Destruction is stateless and highly parallel.</text>
    <text x="32" y="540" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Reconstruction is stateful and sequential.</text>
    <text x="32" y="562" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">T_rebuild = ∑(T_boot + T_sync + T_warmup)</text>
    <text x="32" y="584" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">AI agents evaluate code diffs in isolation,</text>
    <text x="32" y="600" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">failing to model infrastructure restore latencies.</text>
    <text x="32" y="622" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5">Result: Catastrophic availability failure</text>
  </g>

  <!-- PANEL 3: Modern Defense-in-Depth (Right, x=790, w=350) -->
  <g transform="translate(790, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="190" height="26" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <text x="30" y="37" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DEFENSE-IN-DEPTH (2026)</text>
    
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Multi-Layered Guardrails</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Constraining autonomous blast radius</text>

    <!-- Layer 1: SCPs & Boundaries -->
    <g transform="translate(20, 108)">
      <rect width="310" height="96" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="14" y="22" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. Service Control Policies (SCPs)</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Explicit Deny on destructive operations:</text>
      <text x="14" y="56" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5">Deny: cloudformation:DeleteStack, ec2:Terminate*</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Condition: aws:PrincipalTag/Agent=true</text>
      <text x="14" y="88" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Cannot be bypassed by local admin roles</text>
    </g>

    <!-- Layer 2: Dual-Custody Approval -->
    <g transform="translate(20, 214)">
      <rect width="310" height="96" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. Cryptographic Dual-Custody Gate</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• High-impact plans routed to approval queue</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Requires 2 independent human approvals</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Hardware security key (WebAuthn/FIDO2)</text>
      <text x="14" y="88" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Prevents single-engineer bypass</text>
    </g>

    <!-- Layer 3: Ephemeral STS Sessions -->
    <g transform="translate(20, 320)">
      <rect width="310" height="96" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="14" y="22" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3. Ephemeral STS Scoped Sessions</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Time-to-Live (TTL) capped at 60 minutes</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Strict session policies narrow scope</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Auto-revocation on anomalous traffic</text>
      <text x="14" y="88" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9.5">Limits credential exposure window</text>
    </g>

    <!-- Layer 4: Real-Time Circuit Breaker -->
    <g transform="translate(20, 426)">
      <rect width="310" height="96" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">4. CloudTrail Anomaly Circuit Breaker</text>
      <text x="14" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• EventBridge monitors deletion API burst rate</text>
      <text x="14" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• If deletions > 2 within 60s, trigger Lambda</text>
      <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Immediately revokes agent STS token</text>
      <text x="14" y="88" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Hard killswitch halts cascading damage</text>
    </g>

    <!-- Verification Card -->
    <rect x="20" y="534" width="310" height="106" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="556" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2026 Production Standard</text>
    <text x="32" y="574" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• No autonomous agent runs with Admin permissions</text>
    <text x="32" y="590" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• Teardowns isolated to disposable sandbox VPCs</text>
    <text x="32" y="606" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• Cryptographic dual custody enforced in CI/CD</text>
    <text x="32" y="626" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9.5">Zero unverified control-plane deletions</text>
  </g>
</svg>