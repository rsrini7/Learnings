<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 945" width="1120" role="img" aria-labelledby="title desc">
<title id="title">Java at 1M RPS: budget resources and define the promise</title>
<desc id="desc">Capacity examples show one million requests per second, ten milliseconds mean latency and an eight KiB response. The architecture routes cacheable reads to bounded fallback paths and writes to a durable commit or acceptance path before acknowledging the relevant promise.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="945" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">Java at 1M RPS: budget resources and define the promise</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Hypothetical capacity arithmetic, with read and write semantics shown separately.</text>
<rect x="40" y="120" width="300" height="135" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Concurrency budget</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">1M requests/s × 10 ms mean</text>
<text x="60" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">About 10,000 in flight</text>
<text x="60" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Stable system, not a thread count</text>
<rect x="410" y="120" width="300" height="135" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="430" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Network budget</text>
<text x="430" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">8 KiB response at 1M/s</text>
<text x="430" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">About 65.5 Gbit/s payload</text>
<text x="430" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Before overhead and replication</text>
<rect x="780" y="120" width="300" height="135" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="800" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Backend budget</text>
<text x="800" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">95% reads, 99% read hit rate</text>
<text x="800" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">9,500 read misses/s</text>
<text x="800" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">5% writes = 50,000 writes/s</text>
<rect x="40" y="292" width="1040" height="95" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="322" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Edge and application replicas</text>
<text x="60" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Route the defined operations, authenticate, enforce resource budgets and record outcomes.</text>
<path d="M 560 389 V 420 H 290 V 453" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 560 420 H 830 V 453" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="456" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Cacheable read path</text>
<text x="60" y="515" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Check authorization and freshness policy</text>
<text x="60" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Serve hits; coalesce and bound misses</text>
<text x="60" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Test cold-cache and cache-failure behavior</text>
<rect x="580" y="456" width="500" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="600" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Durable write or acceptance path</text>
<text x="600" y="515" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Commit the promised state or work record</text>
<text x="600" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Acknowledge the defined promise afterward</text>
<text x="600" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Make retries and repair behavior explicit</text>
<path d="M 290 598 L 290 638" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 598 L 830 638" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="641" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="671" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Read backend</text>
<text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Replica or database query within its budget</text>
<text x="60" y="722" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Measure lag, query work and pool waits</text>
<rect x="580" y="641" width="500" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="600" y="671" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Storage and deferred processing</text>
<text x="600" y="700" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Committed transaction or durable work queue</text>
<text x="600" y="722" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Bound backlog; manage cache consistency</text>
<rect x="40" y="795" width="1040" height="115" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="60" y="825" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">A valid result includes the workload and failure behavior</text>
<text x="60" y="854" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Report successful rate, latency percentiles, errors, queues, resource use and recovery behavior.</text>
<text x="60" y="876" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Price measured compute, storage and transfers. An instance name does not establish capacity or cost.</text>
