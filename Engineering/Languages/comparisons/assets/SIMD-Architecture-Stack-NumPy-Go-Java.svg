<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; border-radius: 12px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Arrowhead Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1120" height="820" fill="url(#bgGrad)" rx="12" />

  <!-- Header -->
  <text x="560" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">
    SIMD Architecture Stack: NumPy (C++) vs. Go 1.27 vs. Java 27
  </text>
  <text x="560" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">
    Comparing High-Level Tensor Engines, Native SIMD Intrinsics, and Hardware Vector Execution
  </text>

  <!-- Left Layer Indicators -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="95" height="125" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="47" y="55" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">LAYER 1</text>
    <text x="47" y="72" text-anchor="middle" fill="#94a3b8" font-size="10">Application &amp;</text>
    <text x="47" y="85" text-anchor="middle" fill="#94a3b8" font-size="10">User Code</text>

    <rect x="0" y="145" width="95" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="47" y="210" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">LAYER 2</text>
    <text x="47" y="227" text-anchor="middle" fill="#94a3b8" font-size="10">Math Engine /</text>
    <text x="47" y="240" text-anchor="middle" fill="#94a3b8" font-size="10">SIMD API</text>

    <rect x="0" y="320" width="95" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="47" y="380" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">LAYER 3</text>
    <text x="47" y="397" text-anchor="middle" fill="#94a3b8" font-size="10">Compiler /</text>
    <text x="47" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">Runtime Bridge</text>

    <rect x="0" y="485" width="95" height="165" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="47" y="555" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">LAYER 4</text>
    <text x="47" y="572" text-anchor="middle" fill="#94a3b8" font-size="10">CPU Hardware</text>
    <text x="47" y="585" text-anchor="middle" fill="#94a3b8" font-size="10">Registers</text>
  </g>

  <!-- ==================== COLUMN 1: PYTHON / NUMPY ==================== -->
  <g transform="translate(135, 95)">
    <!-- Layer 1: Python App -->
    <rect x="0" y="0" width="305" height="125" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="305" height="32" rx="10" fill="url(#pyGrad)" />
    <rect x="0" y="20" width="305" height="12" fill="url(#pyGrad)" />
    <text x="152" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Python + NumPy (High-Level)</text>
    
    <text x="15" y="52" fill="#93c5fd" font-size="11" font-weight="600">Ergonomic Tensor Syntax:</text>
    <rect x="15" y="60" width="275" height="24" rx="4" fill="#0f172a" />
    <text x="25" y="76" fill="#e2e8f0" font-family="monospace" font-size="11">sim = np.dot(a, b) / (norm(a)*norm(b))</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="11">• Hides memory layout, loops &amp; registers</text>
    <text x="15" y="117" fill="#cbd5e1" font-size="11">• Status: Production Standard (GA)</text>

    <!-- Connector 1 -> 2 -->
    <line x1="152" y1="125" x2="152" y2="143" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- Layer 2: NumPy C++ Engine -->
    <rect x="0" y="145" width="305" height="155" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="168" fill="#60a5fa" font-size="12" font-weight="700">NumPy C / C++ Core &amp; BLAS</text>
    <text x="15" y="187" fill="#cbd5e1" font-size="11">• OpenBLAS / Intel MKL / Apple Accelerate</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="11">• Automatic chunking &amp; tail-element handling</text>
    <text x="15" y="223" fill="#cbd5e1" font-size="11">• Built-in multi-threading &amp; cache tiling</text>
    <text x="15" y="241" fill="#cbd5e1" font-size="11">• N-D array broadcasting &amp; strided views</text>
    <rect x="15" y="255" width="275" height="32" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1" />
    <text x="152" y="275" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Role: Complete Numerical Engine</text>

    <!-- Connector 2 -> 3 -->
    <line x1="152" y1="300" x2="152" y2="318" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- Layer 3: C/C++ Compilation -->
    <rect x="0" y="320" width="305" height="145" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="343" fill="#60a5fa" font-size="12" font-weight="700">C/C++ Compiler &amp; FFI Bridge</text>
    <text x="15" y="363" fill="#cbd5e1" font-size="11">• Python C-API / Cython / PyBind11</text>
    <text x="15" y="381" fill="#cbd5e1" font-size="11">• C/C++ intrinsics (&lt;immintrin.h&gt; / NEON)</text>
    <text x="15" y="399" fill="#cbd5e1" font-size="11">• Runtime CPU feature dispatch (CPUID)</text>
    <text x="15" y="425" fill="#f87171" font-size="11" font-weight="600">Trade-off: Heavy native binary dependencies;</text>
    <text x="15" y="440" fill="#f87171" font-size="11">FFI call overhead on tiny arrays.</text>
  </g>

  <!-- ==================== COLUMN 2: GO 1.27 ==================== -->
  <g transform="translate(460, 95)">
    <!-- Layer 1: Go App / Library -->
    <rect x="0" y="0" width="305" height="125" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="305" height="32" rx="10" fill="url(#goGrad)" />
    <rect x="0" y="20" width="305" height="12" fill="url(#goGrad)" />
    <text x="152" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Go 1.27 Native SIMD</text>
    
    <text x="15" y="52" fill="#6ee7b7" font-size="11" font-weight="600">Pure-Go Libraries (e.g., Gonum / Vector DB):</text>
    <rect x="15" y="60" width="275" height="24" rx="4" fill="#0f172a" />
    <text x="25" y="76" fill="#e2e8f0" font-family="monospace" font-size="11">GOEXPERIMENT=simd go build ./...</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="11">• Zero CGO, single static binary</text>
    <text x="15" y="117" fill="#fbbf24" font-size="11" font-weight="600">• Status: Experimental (Go 1.27, Aug 2026)</text>

    <!-- Connector 1 -> 2 -->
    <line x1="152" y1="125" x2="152" y2="143" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Layer 2: Go simd Package -->
    <rect x="0" y="145" width="305" height="155" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="168" fill="#34d399" font-size="12" font-weight="700">simd &amp; simd/archsimd Packages</text>
    <text x="15" y="187" fill="#cbd5e1" font-size="11">• Explicit register types: simd.Float32s</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="11">• Manual loops: LoadFloat32s, MulAdd</text>
    <text x="15" y="223" fill="#cbd5e1" font-size="11">• Tail elements via LoadFloat32sPart</text>
    <text x="15" y="241" fill="#94a3b8" font-size="11">• Pending GA: Built-in ReduceSum, Go 1 API lock</text>
    <rect x="15" y="255" width="275" height="32" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="152" y="275" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Role: Low-Level Hardware Primitives</text>

    <!-- Connector 2 -> 3 -->
    <line x1="152" y1="300" x2="152" y2="318" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Layer 3: Go Compiler -->
    <rect x="0" y="320" width="305" height="145" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="343" fill="#34d399" font-size="12" font-weight="700">Go SSA Compiler Backend</text>
    <text x="15" y="363" fill="#cbd5e1" font-size="11">• Direct intrinsic lowering (no C/Assembly)</text>
    <text x="15" y="381" fill="#cbd5e1" font-size="11">• Software emulation fallback (simd.Emulated)</text>
    <text x="15" y="399" fill="#cbd5e1" font-size="11">• Preserves effortless cross-compilation</text>
    <text x="15" y="425" fill="#6ee7b7" font-size="11" font-weight="600">Advantage: Zero FFI overhead; ideal for</text>
    <text x="15" y="440" fill="#6ee7b7" font-size="11">RAG vector search, crypto &amp; parsers.</text>
  </g>

  <!-- ==================== COLUMN 3: JAVA 27 ==================== -->
  <g transform="translate(785, 95)">
    <!-- Layer 1: Java App / Library -->
    <rect x="0" y="0" width="305" height="125" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="305" height="32" rx="10" fill="url(#javaGrad)" />
    <rect x="0" y="20" width="305" height="12" fill="url(#javaGrad)" />
    <text x="152" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Java 27 Vector API (Panama)</text>
    
    <text x="15" y="52" fill="#fcd34d" font-size="11" font-weight="600">Used in Apache Lucene, Elasticsearch, DJL:</text>
    <rect x="15" y="60" width="275" height="24" rx="4" fill="#0f172a" />
    <text x="25" y="76" fill="#e2e8f0" font-family="monospace" font-size="11">java --add-modules jdk.incubator.vector</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="11">• Pure Java, zero JNI overhead</text>
    <text x="15" y="117" fill="#fbbf24" font-size="11" font-weight="600">• Status: 12th Incubator (JEP 537, Sep 2026)</text>

    <!-- Connector 1 -> 2 -->
    <line x1="152" y1="125" x2="152" y2="143" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />

    <!-- Layer 2: jdk.incubator.vector -->
    <rect x="0" y="145" width="305" height="155" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="168" fill="#fbbf24" font-size="12" font-weight="700">jdk.incubator.vector Package</text>
    <text x="15" y="187" fill="#cbd5e1" font-size="11">• Shape-agnostic: SPECIES_PREFERRED</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="11">• Built-in reductions: .reduceLanes(ADD)</text>
    <text x="15" y="223" fill="#cbd5e1" font-size="11">• Branchless tail handling via VectorMask</text>
    <text x="15" y="241" fill="#94a3b8" font-size="11">• GA Blocker: Awaiting Project Valhalla</text>
    <rect x="15" y="255" width="275" height="32" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1" />
    <text x="152" y="275" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Role: Shape-Agnostic SIMD Primitives</text>

    <!-- Connector 2 -> 3 -->
    <line x1="152" y1="300" x2="152" y2="318" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />

    <!-- Layer 3: HotSpot C2 JIT -->
    <rect x="0" y="320" width="305" height="145" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="343" fill="#fbbf24" font-size="12" font-weight="700">HotSpot C2 JIT Compiler</text>
    <text x="15" y="363" fill="#cbd5e1" font-size="11">• Runtime adaptation to host CPU width</text>
    <text x="15" y="381" fill="#cbd5e1" font-size="11">• Escape analysis scalarizes vector objects</text>
    <text x="15" y="399" fill="#cbd5e1" font-size="11">• Valhalla will make vectors true value types</text>
    <text x="15" y="425" fill="#fcd34d" font-size="11" font-weight="600">Advantage: Write once, scales automatically</text>
    <text x="15" y="440" fill="#fcd34d" font-size="11">across 128-bit, 256-bit &amp; 512-bit CPUs.</text>
  </g>

  <!-- Connectors 3 -> 4 (All columns converge on Hardware) -->
  <line x1="287" y1="560" x2="287" y2="578" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <line x1="612" y1="560" x2="612" y2="578" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <line x1="937" y1="560" x2="937" y2="578" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowPurple)" />

  <!-- ==================== LAYER 4: SHARED HARDWARE LAYER ==================== -->
  <g transform="translate(135, 580)">
    <rect x="0" y="0" width="955" height="165" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect x="0" y="0" width="955" height="32" rx="12" fill="url(#hwGrad)" />
    <rect x="0" y="20" width="955" height="12" fill="url(#hwGrad)" />
    <text x="477" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">
      CPU Vector Hardware Execution (Single Instruction, Multiple Data — x86 AVX2 / AVX-512 &amp; ARM NEON / SVE)
    </text>

    <!-- Visual Register Illustration -->
    <g transform="translate(20, 46)">
      <text x="0" y="12" fill="#c4b5fd" font-size="11" font-weight="700">256-bit SIMD Register Example (8 × float32 Lanes Processed in 1 CPU Cycle):</text>
      
      <!-- Vector A -->
      <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">Vec A:</text>
      <g transform="translate(50, 22)">
        <rect x="0" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="34" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[0]</text>
        <rect x="72" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="106" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[1]</text>
        <rect x="144" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="178" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[2]</text>
        <rect x="216" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="250" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[3]</text>
        <rect x="288" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="322" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[4]</text>
        <rect x="360" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="394" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[5]</text>
        <rect x="432" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="466" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[6]</text>
        <rect x="504" y="0" width="68" height="22" rx="3" fill="#312e81" stroke="#6366f1" />
        <text x="538" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">a[7]</text>
      </g>

      <!-- Operation Badge -->
      <text x="0" y="65" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">MulAdd:</text>
      <text x="336" y="65" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">
        ⊗  8 Parallel Fused Multiply-Add (FMA) Lanes Executed Simultaneously  ⊗
      </text>

      <!-- Vector B -->
      <text x="0" y="92" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">Vec B:</text>
      <g transform="translate(50, 76)">
        <rect x="0" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="34" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[0]</text>
        <rect x="72" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="106" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[1]</text>
        <rect x="144" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="178" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[2]</text>
        <rect x="216" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="250" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[3]</text>
        <rect x="288" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="322" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[4]</text>
        <rect x="360" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="394" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[5]</text>
        <rect x="432" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="466" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[6]</text>
        <rect x="504" y="0" width="68" height="22" rx="3" fill="#1e1b4b" stroke="#6366f1" />
        <text x="538" y="15" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="10">b[7]</text>
      </g>

      <!-- Register Width Key (Right Side of Layer 4) -->
      <rect x="645" y="14" width="270" height="86" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
      <text x="658" y="34" fill="#c4b5fd" font-size="11" font-weight="700">Hardware Register Widths:</text>
      <text x="658" y="52" fill="#cbd5e1" font-size="11">• 128-bit (SSE / ARM NEON) → 4 floats</text>
      <text x="658" y="69" fill="#cbd5e1" font-size="11">• 256-bit (AVX2) → 8 floats</text>
      <text x="658" y="86" fill="#cbd5e1" font-size="11">• 512-bit (AVX-512) → 16 floats</text>
    </g>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="20" y="762" width="1070" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="555" y="788" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">
    Key Takeaway: Go 1.27 &amp; Java 27 expose Layer 2/3 SIMD intrinsics directly—allowing pure-Go &amp; pure-Java libraries to match NumPy's C++ speed without CGO or JNI.
  </text>
</svg>