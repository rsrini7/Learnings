<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" role="img" aria-labelledby="title desc">
<title id="title">Durable workflows: recovery and the side-effect gap</title>
<desc id="desc">A workflow service stores progress and schedules workers. A worker can crash after a payment succeeds but before completion is recorded. A retry must reuse a stable idempotency key or use reconciliation to avoid duplicate business effects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="800" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">Durable workflows: recovery and the side-effect gap</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Persisted progress enables recovery. External effects still need a retry strategy.</text>
<rect x="40" y="120" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Durable workflow state</text>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">History, journal or checkpoints</text>
<text x="60" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Tracks completed and pending work</text>
<rect x="410" y="120" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="430" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Application worker</text>
<text x="430" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Executes the next activity</text>
<text x="430" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">May crash or lose connectivity</text>
<rect x="780" y="120" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="800" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">External service</text>
<text x="800" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Payment, shipping or storage</text>
<text x="800" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Has its own state and failures</text>
<path d="M 341 178 L 408 178" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 711 178 L 778 178" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">THE AMBIGUOUS FAILURE WINDOW</text>
<rect x="40" y="300" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">1. External action succeeds</text>
<text x="60" y="359" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">The payment provider records a charge</text>
<text x="60" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">The worker has not saved the result yet</text>
<rect x="580" y="300" width="500" height="115" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">2. Worker fails before completion is saved</text>
<text x="600" y="359" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Durable state has no completion record</text>
<text x="600" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Recovery may schedule the activity again</text>
<path d="M 541 358 L 578 358" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 417 L 830 460" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="463" width="500" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="493" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Recovery reconstructs known progress</text>
<text x="60" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Use recorded results for completed steps</text>
<text x="60" y="544" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Follow the selected engine’s replay rules</text>
<rect x="580" y="463" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="600" y="493" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">3. Retry safely or reconcile</text>
<text x="600" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Reuse a stable operation idempotency key</text>
<text x="600" y="544" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Define review for non-repeatable actions</text>
<rect x="40" y="615" width="1040" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="60" y="645" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Verify the business result as well as the workflow</text>
<text x="60" y="674" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Interrupt execution between external success and saved completion. Check the external system.</text>
<text x="60" y="696" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">A resumed workflow does not, by itself, prove that an external action happened once.</text>
<text x="40" y="770" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Conceptual flow: persistence details and retry guarantees differ between workflow engines.</text>
</svg>
