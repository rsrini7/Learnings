<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 768" width="1120" role="img" aria-labelledby="title desc">
<title id="title">Kafka 4.0: metadata and record delivery</title>
<desc id="desc">A controller quorum sends metadata to brokers. Below, conventional consumer groups assign partitions, while share groups acquire records and acknowledge processing. Share groups were early access in Kafka 4.0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="768" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">Kafka 4.0: metadata and record delivery</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">KRaft manages cluster metadata. Consumer protocols determine how applications receive work.</text>
<text x="40" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">CLUSTER METADATA AND DATA ACCESS</text>
<rect x="40" y="130" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">KRaft controllers</text>
<text x="60" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Replicate metadata with Raft</text>
<text x="60" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Coordinate partition leaders</text>
<rect x="410" y="130" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="430" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Kafka brokers</text>
<text x="430" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Store replicated event logs</text>
<text x="430" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Serve produce and fetch</text>
<rect x="780" y="130" width="300" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="800" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Data clients</text>
<text x="800" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Producers append records</text>
<text x="800" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Consumers retrieve records</text>
<path d="M 341 187 L 408 187" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 711 187 L 778 187" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">TWO CONSUMPTION MODELS</text>
<rect x="40" y="310" width="500" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Conventional consumer group</text>
<text x="60" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Assign each partition to one group member</text>
<text x="60" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Track progress using committed offsets</text>
<text x="60" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Members independently own their assignments</text>
<rect x="580" y="310" width="500" height="140" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Share group in Kafka 4.0</text>
<text x="600" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Members acquire records within a partition</text>
<text x="600" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Acknowledge processing or permit redelivery</text>
<text x="600" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Early access: evaluate release-specific limits</text>
<path d="M 290 452 L 290 495" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 452 L 830 495" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="498" width="500" height="115" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Application consequence</text>
<text x="60" y="557" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Partition count limits active assignments</text>
<text x="60" y="579" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Preserve ordering requirements per partition</text>
<rect x="580" y="498" width="500" height="115" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Application consequence</text>
<text x="600" y="557" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Multiple workers can share partition work</text>
<text x="600" y="579" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Completion order and retries need design</text>
<rect x="40" y="640" width="1040" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="670" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Upgrade decisions are separate</text>
<text x="60" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Migrate ZooKeeper before a 4.0 upgrade. Opt into the new consumer protocol deliberately.</text>
<text x="60" y="721" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Share groups and ELR had separate preview status in Kafka 4.0.</text>
</svg>
