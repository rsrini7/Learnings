<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 870" width="1120" role="img" aria-labelledby="title desc">
<title id="title">Passkeys: security spans the account lifecycle</title>
<desc id="desc">A new credential is added only after enrollment is authorized. WebAuthn login creates an application session after successful verification. Recovery can replace credentials or restore account access, and must define proof, notification and revocation. A session or recovery compromise can bypass the ordinary sign-in route.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1120" height="870" rx="16" fill="#0b0f19"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#e2e8f0" font-weight="700">Passkeys: security spans the account lifecycle</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">Cryptographic sign-in is one boundary. Enrollment, recovery and sessions need their own controls.</text>
<rect x="40" y="125" width="500" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="155" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Enrollment and additional credentials</text>
<text x="60" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Prove authority to modify this account</text>
<text x="60" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Register and verify the new credential</text>
<text x="60" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Notify, audit and support credential revocation</text>
<rect x="580" y="125" width="500" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="600" y="155" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Device and credential provider</text>
<text x="600" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Device-bound keys need a loss plan</text>
<text x="600" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Synced keys depend on the provider’s design</text>
<text x="600" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Local verification can use biometrics or a PIN</text>
<path d="M 290 267 L 290 307" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 267 L 830 307" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="310" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">WebAuthn authentication</text>
<text x="60" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Fresh challenge and configured RP/origin checks</text>
<text x="60" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Signature and required verification flags</text>
<text x="60" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Accept only the correct credential/account</text>
<rect x="580" y="310" width="500" height="140" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">Recovery and fallback</text>
<text x="600" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Define the proof needed to restore access</text>
<text x="600" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Decide which credentials are added or revoked</text>
<text x="600" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">A weaker reset route is another entry path</text>
<path d="M 290 452 L 290 492" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 830 452 L 830 492" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="495" width="500" height="140" rx="12" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.6"/>
<text x="60" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ade80" font-weight="700">Application session and authorization</text>
<text x="60" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Protect session tokens and check permissions</text>
<text x="60" y="576" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Apply stronger proof to sensitive changes</text>
<text x="60" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Authentication does not authorize every action</text>
<rect x="580" y="495" width="500" height="140" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="600" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbbf24" font-weight="700">After loss or suspected compromise</text>
<text x="600" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Review registered credentials and sessions</text>
<text x="600" y="576" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Revoke access according to the account policy</text>
<text x="600" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Verify recovery outcomes and audit evidence</text>
<rect x="40" y="680" width="1040" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="60" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#38bdf8" font-weight="700">Verify each path into and through the account</text>
<text x="60" y="739" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">Check unauthorized enrollment, wrong origin, reused challenge, missing devices and recovery.</text>
<text x="60" y="761" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">A successful passkey login does not establish the security of every session or reset operation.</text>
<text x="40" y="838" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" font-weight="700">Engineering guidance: recovery and session invalidation are application responsibilities.</text>
</svg>
